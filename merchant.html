<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>لوحة التاجر — NOJ</title>
<meta name="theme-color" content="#12235C">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root{
    --navy:#12235C; --navy-2:#1B3A7A;
    --bg:#F7F8FC; --card:#FFFFFF; --line:#EDF0F7;
    --text:#12235C; --muted:#8A93AD;
    --green:#22A87A; --red:#DC2626; --orange:#F59E0B;
    --ease-brand:cubic-bezier(.22,.9,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow-x:hidden}
  body{font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font:inherit}
  h1,h2,h3,p{margin:0}

  /* ================= AUTH (دخول برقم الجوال — نفس أسلوب index.html) ================= */
  .auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
  .auth-inner{max-width:420px;width:100%;margin:0 auto;padding:0 24px 40px;display:flex;flex-direction:column;min-height:100%}
  .auth-brand{text-align:center;padding:56px 0 8px}
  .auth-mark{width:72px;height:72px;border-radius:20px;border:4px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;margin:0 auto 14px;direction:ltr}
  .auth-brand b{font-size:28px;font-weight:800;letter-spacing:-.5px;display:block}
  .auth-brand span{font-size:13px;color:var(--muted);display:block;margin-top:4px}
  .auth-body{margin-top:36px;animation:fadeUp .4s ease both}
  .auth-body h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .auth-body p{font-size:14px;color:var(--muted);line-height:1.7}
  .field{margin-top:24px}
  .phone-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
  .phone-box:focus-within{border-color:var(--navy);box-shadow:0 0 0 4px rgba(18,35,92,.07)}
  .phone-box .cc{font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
  .phone-box input{flex:1;border:none;outline:none;background:none;padding:16px 0;font-size:17px;font-weight:600;letter-spacing:1px;direction:ltr;text-align:left;color:var(--text)}
  .phone-box input::placeholder{letter-spacing:1px;color:#C3C9D9;font-weight:500}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .err{font-size:12px;color:var(--red);margin-top:10px;font-weight:600}
  .otp-row{display:flex;gap:10px;direction:ltr;justify-content:center;margin-top:6px}
  .otp-row input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:800;border:1.5px solid var(--line);border-radius:14px;background:var(--card);outline:none;color:var(--text);transition:border-color .18s,box-shadow .18s}
  .otp-row input:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(18,35,92,.07)}
  .otp-row input.filled{border-color:var(--navy)}
  .otp-row.bad input{border-color:var(--red);animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .cta{width:100%;padding:16px;border-radius:16px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;margin-top:24px;transition:transform .16s,opacity .2s}
  .cta:active{transform:scale(.97)}
  .cta:disabled{opacity:.4;cursor:not-allowed}
  .ghost{width:100%;padding:14px;font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
  .auth-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.8}
  #turnstile-container{margin-top:16px;display:flex;justify-content:center;min-height:1px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* ================= لا صلاحية ================= */
  .noaccess{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .noaccess-box{max-width:360px;text-align:center}
  .noaccess-box h2{font-size:20px;font-weight:800;margin-top:18px}
  .noaccess-box p{font-size:14px;color:var(--muted);line-height:1.8;margin-top:10px}

  /* ================= اللوحة ================= */
  .app{max-width:720px;margin:0 auto;padding:0 20px 60px;min-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1.5px solid var(--line);margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .topbar-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
  .topbar-brand .mk{width:34px;height:34px;border-radius:10px;border:2.5px solid var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;direction:ltr}
  .topbar-right{display:flex;align-items:center;gap:10px}
  #merchantSelect{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-weight:700;font-size:13px;color:var(--text)}
  .merchant-name{font-weight:700;font-size:14px}
  .logout-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);padding:8px 10px;border-radius:10px}
  .logout-btn:hover{background:var(--line)}

  .sec-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}
  .sec-h h2{font-size:17px;font-weight:800}
  .add-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy);background:rgba(18,35,92,.07);padding:9px 14px;border-radius:12px}

  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
  .empty{font-size:13px;color:var(--muted);text-align:center;padding:30px 10px}

  .dev-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
  .dev-row:last-child{border-bottom:none}
  .dev-info b{font-size:14px;display:block}
  .dev-info small{font-size:12px;color:var(--muted);display:block;margin-top:3px;direction:ltr;text-align:right}
  .badge{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:99px;white-space:nowrap}
  .badge.active{color:var(--green);background:rgba(34,168,122,.12)}
  .badge.revoked{color:var(--red);background:rgba(220,38,38,.1)}
  .dev-actions{display:flex;align-items:center;gap:8px}
  .revoke-btn{font-size:12.5px;font-weight:700;color:var(--red);padding:7px 12px;border-radius:10px;background:rgba(220,38,38,.07)}

  .form-f{display:block;margin-bottom:14px}
  .form-f label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
  .form-f input,.form-f select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);color:var(--text)}
  .form-f input:focus,.form-f select:focus{outline:none;border-color:var(--navy)}
  .approve-btn{width:100%;padding:13px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;margin-top:4px;transition:transform .16s,opacity .2s}
  .approve-btn:active{transform:scale(.98)}
  .approve-btn:disabled{opacity:.5;cursor:not-allowed}
  .form-warn{font-size:12.5px;color:var(--red);margin-top:8px;font-weight:600}

  /* ================= تأكيد الإلغاء (overlay) ================= */
  .ov{position:fixed;inset:0;z-index:200;background:rgba(18,35,92,.35);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .confirm-box{background:var(--card);border-radius:18px;max-width:340px;width:100%;padding:22px;text-align:center}
  .confirm-box h3{font-size:16px;font-weight:800}
  .confirm-box p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.7}
  .confirm-row{display:flex;gap:10px;margin-top:20px}
  .confirm-row button{flex:1;padding:12px;border-radius:12px;font-size:13.5px;font-weight:700}
  .confirm-cancel{background:var(--bg);color:var(--text)}
  .confirm-ok{background:var(--red);color:#fff}

  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(14px);opacity:0;transition:.3s;z-index:300;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast div{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 20px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

  .loading-row{text-align:center;padding:40px 0;color:var(--muted);font-size:13px}

  /* ================= إعدادات الفرع / الرمز / توكن POS ================= */
  .adm-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .logo-preview{width:56px;height:56px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--line);flex-shrink:0}
  .logo-preview img{width:100%;height:100%;object-fit:cover}
  .logo-preview svg{opacity:.3}
  .btn-outline{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--navy);background:var(--card)}
  .logo-remove{font-size:12px;font-weight:700;color:var(--red);padding:8px 10px}
  .sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .sw button{padding:9px 14px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
  .sw button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .pin-input{width:100%;max-width:160px;text-align:center;letter-spacing:10px;font-size:20px;font-weight:800;border:1.5px solid var(--line);border-radius:12px;padding:12px 10px 12px 2px;background:var(--bg);color:var(--text)}
  .pin-input:focus{outline:none;border-color:var(--navy)}
  .token-box{background:var(--bg);border:1.5px dashed var(--navy-2);border-radius:12px;padding:14px;margin-top:14px;word-break:break-all;font-size:12.5px;direction:ltr;text-align:left;font-family:monospace;color:var(--text)}
  .token-warn{font-size:12.5px;color:var(--orange);font-weight:700;margin-top:10px}
  .ok-msg{font-size:12.5px;color:var(--green);margin-top:8px;font-weight:600}
  .conn-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin:-6px 0 6px;padding:4px;background:var(--line);border-radius:14px}
  .tabs button{flex:1;padding:10px 8px;border-radius:11px;font-size:13.5px;font-weight:800;color:var(--muted)}
  .tabs button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(18,35,92,.12)}
  .inv-filters{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .inv-range{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .inv-range .form-f{margin:0;flex:1;min-width:130px}
  .inv-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .inv-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
  .inv-card>span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
  .inv-card b{display:block;margin-top:6px;font-size:17px;font-weight:800;color:var(--text)}
  .inv-card b small{font-size:11px;font-weight:700;color:var(--muted)}
  .inv-card.net{grid-column:1/-1;background:var(--navy);border-color:var(--navy)}
  .inv-card.net>span,.inv-card.net b small{color:rgba(255,255,255,.7)}
  .inv-card.net b{color:#fff;font-size:21px}
  .inv-row{padding:13px 0;border-bottom:1px solid var(--line)}
  .inv-row:last-child{border-bottom:none}
  .inv-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .inv-top b{font-size:13.5px}
  .inv-sub{font-size:12px;color:var(--muted);margin-top:4px}
  .inv-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:10px}
  .inv-nums div{font-size:11.5px;color:var(--muted)}
  .inv-nums div b{display:block;margin-top:2px;font-size:13.5px;color:var(--text)}
  .inv-nums div.ref b{color:var(--red)}
  .num{direction:ltr;unicode-bidi:isolate;display:inline-block}
  b.num{text-align:right}
  .badge.warn{color:#B45309;background:rgba(245,158,11,.14)}
  .bk-actions{display:flex;gap:8px;margin-top:10px}
  .bk-actions .approve-btn{max-width:120px;padding:9px 14px;font-size:12.5px}
  .sec-h .btn-outline{padding:6px 12px}
  .owner-only-note{font-size:12px;color:var(--muted);text-align:center;padding:16px 0}
</style>
</head>
<body>
<div class="auth" id="auth"></div>
<div class="noaccess" id="noaccess" style="display:none"></div>
<div class="app" id="app" style="display:none"></div>
<div class="toast" id="toast"><div id="toast-text"></div></div>

<script>
/* ============================================================================
   لوحة التاجر — merchant.html
   ============================================================================
   ملف قائم بذاته (بلا اعتماديات خارجية سوى Supabase/Turnstile، نفس استثناء
   index.html/kiosk.html) — المرحلة الأولى: دخول برقم الجوال + شاشة الأجهزة
   فقط (اعتماد/إلغاء). لا تطبيق مبدئي لأي من: توكن POS، رمز PIN، الفواتير،
   العملاء — تلك مراحل لاحقة منفصلة حسب التصميم المعتمد.

   دخول برقم الجوال مباشرة (Supabase Phone OTP)، لا ترقية جلسة مجهولة
   إطلاقاً (خلافاً لـ index.html) — لا داعي هنا: لا تصفّح قبل تسجيل الدخول،
   فالجلسة الحقيقية تُنشأ من أول استدعاء. signInWithOtp()/verifyOtp() مباشرة.

   storageKey مختلف تماماً عن index.html/kiosk.html (اللذين يعتمدان مفتاح
   supabase-js الافتراضي، المشتق من رابط المشروع فقط لا من مسار الصفحة) —
   لازم لأن الثلاثة تعمل من نفس الأصل (origin) على GitHub Pages، فـ
   localStorage مشترك فعلياً بينها؛ تاجر قد يكون عميلاً مسجَّلاً بنفس رقم
   جواله على نفس الجهاز (نفس المتصفح) — بلا storageKey مستقل هنا، تسجيل
   الدخول للوحة كان سيستبدل جلسة الكشك/التطبيق في نفس المتصفح بصمت.

   بعد الدخول: التحقق من merchant_members لـ auth.uid() فقط (لا ثقة بأي
   شيء آخر) — صف غير موجود = "لا تملك صلاحية وصول"، بلا أي بيانات. لا
   إنشاء profile ولا صف merchant_members من هذه الصفحة أبداً تحت أي ظرف.
*/

const SUPABASE_URL='https://jqddjswxsacejbqjeehw.supabase.co';
const SUPABASE_KEY='sb_publishable_tv2luaaynJu1c5Ce9loWFg_GQmMRTD-';
const MERCHANT_STORAGE_KEY='sb-noj-merchant-auth';

var __sbPromise=null;
function getSb(){
  if(!__sbPromise){
    __sbPromise=(async function(){
      if(window.__NOJ_SUPABASE_CLIENT__) return window.__NOJ_SUPABASE_CLIENT__;
      try{
        const mod=await import('https://esm.sh/@supabase/supabase-js@2');
        return mod.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:MERCHANT_STORAGE_KEY}});
      }catch(e){
        console.error('NOJ merchant: تعذّر تحميل مكتبة Supabase',e);
        return null;
      }
    })();
  }
  return __sbPromise;
}

/* ================= TURNSTILE (CAPTCHA) =================
   نفس المفتاح والأسلوب في index.html/kiosk.html بالضبط — رمز طازج قبل كل
   نداء signInWithOtp على حدة (استهلاك مرة واحدة فقط لدى Cloudflare/
   Supabase، مؤكَّد عملياً، راجع CLAUDE.md). verifyOtp نفسها لا تحتاج
   captchaToken (تحقق من رمز صادر فعلاً، لا إصدار جديد). */
var TURNSTILE_SITE_KEY='0x4AAAAAAFQQChrEhtP_Q7DQ';
var __turnstileScriptPromise=null;
function loadTurnstileScript(){
  if(window.turnstile)return Promise.resolve();
  if(!__turnstileScriptPromise){
    __turnstileScriptPromise=new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src='https://challenges.cloudflare.com/turnstile/v0/api.js';
      s.async=true;
      s.onload=function(){resolve()};
      s.onerror=function(){reject(new Error('turnstile-script-load-failed'))};
      document.head.appendChild(s);
    });
  }
  return __turnstileScriptPromise;
}
var turnstileToken=null;
var turnstileWidgetId=null;
function renderTurnstileWidget(){
  loadTurnstileScript().then(function(){
    var el=document.getElementById('turnstile-container');
    if(!el||!window.turnstile)return;
    if(turnstileWidgetId!==null){try{turnstile.remove(turnstileWidgetId)}catch(e){}}
    turnstileToken=null;
    turnstileWidgetId=turnstile.render(el,{
      sitekey:TURNSTILE_SITE_KEY,
      callback:function(token){turnstileToken=token},
      'expired-callback':function(){turnstileToken=null},
      'error-callback':function(){turnstileToken=null}
    });
  }).catch(function(e){console.error('NOJ merchant: تعذّر تحميل Turnstile',e)});
}
function resetTurnstileToken(){
  turnstileToken=null;
  if(turnstileWidgetId!==null&&window.turnstile){try{turnstile.reset(turnstileWidgetId)}catch(e){}}
}
function waitForTurnstileToken(maxMs){
  if(turnstileToken)return Promise.resolve(turnstileToken);
  return new Promise(function(resolve){
    var waited=0;
    var iv=setInterval(function(){
      waited+=150;
      if(turnstileToken||waited>=maxMs){clearInterval(iv);resolve(turnstileToken)}
    },150);
  });
}
async function freshTurnstileToken(maxMs){
  var token=await waitForTurnstileToken(maxMs);
  resetTurnstileToken();
  return token;
}

function toast(m){
  var e=document.getElementById('toast');
  document.getElementById('toast-text').textContent=m;
  e.classList.add('on');
  setTimeout(function(){e.classList.remove('on')},2400);
}

/* ================= حالة الدخول ================= */
var OTP_LENGTH=6;
var A={phone:'',code:'',step:'phone',err:'',secs:0,timer:null};

function fmtPhone(p){return p.replace(/(\d{2})(\d{3})(\d{4})/,'$1 $2 $3').trim()}

function authPhone(){
  return '<div class="auth-body">'+
    '<h2>دخول التاجر</h2>'+
    '<p>أدخل رقم جوالك المسجَّل وسنرسل لك رمز تحقق مكوّن من '+OTP_LENGTH+' أرقام.</p>'+
    '<div class="field"><label>رقم الجوال</label>'+
      '<div class="phone-box"><span class="cc">🇸🇦 +966</span>'+
      '<input id="ph" type="tel" inputmode="numeric" maxlength="9" placeholder="5X XXX XXXX" value="'+escAttr(A.phone)+'"></div>'+
      (A.err?'<div class="err">'+A.err+'</div>':'<div class="hint">سيصلك الرمز عبر رسالة نصية على هذا الرقم.</div>')+
    '</div>'+
    '<button class="cta" id="send">إرسال رمز التحقق</button>'+
    '<div id="turnstile-container"></div>'+
  '</div>';
}

function authCode(){
  var boxes='';
  for(var i=0;i<OTP_LENGTH;i++){
    var v=A.code[i]||'';
    boxes+='<input type="tel" inputmode="numeric" maxlength="1" data-otp="'+i+'" value="'+v+'"'+(v?' class="filled"':'')+'>';
  }
  return '<div class="auth-body">'+
    '<h2>رمز التحقق</h2>'+
    '<p>أرسلنا رمزًا مكوّنًا من '+OTP_LENGTH+' أرقام إلى<br><b style="color:var(--text);direction:ltr;display:inline-block">+966 '+fmtPhone(A.phone)+'</b> '+
    '<button id="edit" style="color:var(--navy);font-weight:700;font-size:13px">تعديل</button></p>'+
    '<div class="field"><div class="otp-row'+(A.err?' bad':'')+'" id="otp">'+boxes+'</div>'+
    (A.err?'<div class="err" style="text-align:center">'+A.err+'</div>':'')+'</div>'+
    '<button class="cta" id="verify"'+(A.code.length<OTP_LENGTH?' disabled':'')+'>'+(A.verifying?'<span class="spinner"></span> جارٍ التحقق...':'تأكيد الدخول')+'</button>'+
    '<button class="ghost" id="resend">'+(A.secs>0?'إعادة الإرسال بعد '+A.secs+' ثانية':'لم يصلك الرمز؟ <b>إعادة الإرسال</b>')+'</button>'+
    '<div id="turnstile-container"></div>'+
  '</div>';
}

function renderAuth(){
  var el=document.getElementById('auth');
  el.innerHTML='<div class="auth-inner">'+
    '<div class="auth-brand"><div class="auth-mark">N</div><b>لوحة التاجر</b><span>NOJ — No Ordinary Journey</span></div>'+
    (A.step==='phone'?authPhone():authCode())+'</div>';
  bindAuth();
}

function startTimer(){
  A.secs=30;
  clearInterval(A.timer);
  var updateResend=function(){
    var r=document.getElementById('resend');
    if(r)r.innerHTML=A.secs>0?'إعادة الإرسال بعد '+A.secs+' ثانية':'لم يصلك الرمز؟ <b>إعادة الإرسال</b>';
  };
  updateResend();
  A.timer=setInterval(function(){
    A.secs--;
    if(A.secs<=0){clearInterval(A.timer);A.secs=0}
    updateResend();
  },1000);
}

function bindAuth(){
  var ph=document.getElementById('ph');
  if(ph){
    ph.oninput=function(){
      this.value=this.value.replace(/\D/g,'').slice(0,9);
      A.phone=this.value;
      if(A.err){
        A.err='';
        var e=document.querySelector('.auth-body .err');
        if(e)e.outerHTML='<div class="hint">سيصلك الرمز عبر رسالة نصية على هذا الرقم.</div>';
      }
    };
    ph.onkeydown=function(e){if(e.key==='Enter')document.getElementById('send').click()};
    setTimeout(function(){ph.focus()},250);
  }

  var send=document.getElementById('send');
  if(send)send.onclick=function(){sendOtp()};

  var edit=document.getElementById('edit');
  if(edit)edit.onclick=function(){A.step='phone';A.code='';A.err='';clearInterval(A.timer);renderAuth()};

  var otps=document.querySelectorAll('[data-otp]');
  function readCode(){var s='';[].forEach.call(otps,function(b){s+=(b.value||'')});return s}
  [].forEach.call(otps,function(box,idx){
    box.oninput=function(){
      var v=this.value.replace(/\D/g,'');
      if(v.length>1){
        for(var k=0;k<otps.length;k++){
          otps[k].value=v[k]||'';
          if(otps[k].value)otps[k].classList.add('filled');else otps[k].classList.remove('filled');
        }
        this.blur();
      }else{
        this.value=v;
        if(v)this.classList.add('filled');else this.classList.remove('filled');
        if(v&&idx<OTP_LENGTH-1)otps[idx+1].focus();
      }
      A.code=readCode();A.err='';
      var vb=document.getElementById('verify');
      if(vb)vb.disabled=A.code.length<OTP_LENGTH;
      if(A.code.length===OTP_LENGTH)setTimeout(doVerify,180);
    };
    box.onkeydown=function(e){
      if(e.key==='Backspace'&&!this.value&&idx>0){
        otps[idx-1].focus();otps[idx-1].value='';otps[idx-1].classList.remove('filled');
        A.code=readCode();
        var vb=document.getElementById('verify');
        if(vb)vb.disabled=A.code.length<OTP_LENGTH;
      }
    };
    box.onfocus=function(){this.select()};
  });
  if(otps.length)setTimeout(function(){
    var next=A.code.length<OTP_LENGTH?otps[A.code.length]:otps[OTP_LENGTH-1];
    (next||otps[0]).focus();
  },250);

  // كلا الشاشتين (رقم الجوال ورمز التحقق) تحمل #turnstile-container — بلا
  // شرط على A.step، تطابقاً حرفياً مع index.html: resendOtp() من شاشة
  // الرمز تحتاج ودجتاً حياً هناك أيضاً، لا الودجت المتبقي (والمُستهلَك
  // غالباً) من شاشة رقم الجوال فقط.
  renderTurnstileWidget();

  var v=document.getElementById('verify');
  if(v)v.onclick=doVerify;

  var rs=document.getElementById('resend');
  if(rs)rs.onclick=function(){if(A.secs>0)return;resendOtp()};
}

/* يُرسِل OTP مباشرة (signInWithOtp) — لا جلسة مجهولة تُرقَّى هنا إطلاقاً،
   خلافاً لـ index.html؛ لا داعي لذلك التعقيد أصلاً لأن لا تصفّح قبل تسجيل
   الدخول في هذه الصفحة.

   عطل حي مُصلَح هنا: السطر القديم "A.sending=true;A.err='';renderAuth();"
   كان يُعاد بناء الشاشة بالكامل (innerHTML) **بعد** أن ودجت Turnstile
   أنجز تحققه فعلاً وعرض "تم بنجاح" — renderAuth()→bindAuth()→
   renderTurnstileWidget() يُزيل الودجت المُتحقَّق ويُنشئ ودجتاً جديداً من
   الصفر (turnstileToken=null)، فيُضطر freshTurnstileToken() التالي مباشرة
   للانتظار من جديد — سباق حقيقي قد لا يكتمل خلال المهلة، يظهر كـ"تعذّر
   التحقق الأمني" للمستخدم رغم أن الودجت كان قد نجح فعلاً قبل الضغط على
   الزر. الإصلاح: تعديل الزر مباشرة (disabled/innerHTML) بدل renderAuth()،
   فلا يُلمَس حاوية Turnstile إطلاقاً أثناء وجود رمز صالح بالفعل. */
async function sendOtp(){
  if(A.phone.length<9||A.phone[0]!=='5'){
    A.err='أدخل رقم جوال سعودي صحيح يبدأ بـ 5 (9 أرقام).';
    renderAuth();return;
  }
  var sendBtn=document.getElementById('send');
  if(sendBtn){sendBtn.disabled=true;sendBtn.innerHTML='<span class="spinner"></span> جارٍ الإرسال...';}

  var sb=await getSb();
  if(!sb){
    if(sendBtn){sendBtn.disabled=false;sendBtn.textContent='إرسال رمز التحقق';}
    A.err='تعذّر الاتصال بالخادم.';renderAuth();return;
  }

  var fullPhone='+966'+A.phone;
  var captchaToken=await freshTurnstileToken(2500);
  var res=await sb.auth.signInWithOtp({phone:fullPhone,options:{captchaToken:captchaToken||undefined}});
  if(res.error){
    A.err=captchaErrorMessage(res.error,captchaToken);
    renderAuth();return;
  }

  A.step='code';A.code='';A.err='';
  renderAuth();startTimer();
}

/* يميّز مصدر رفض CAPTCHA: لم يصل أي رمز من المتصفح خلال المهلة (مشكلة
   واجهة/شبكة محلية — captchaToken فارغ هنا) مقابل وصول رمز فعلاً
   ورفضه من Supabase (مشكلة خادم/رمز مُستهلَك مسبقاً) — رسالتان مختلفتان
   بدل رسالة واحدة عامة، حتى يسهل تشخيص أيهما يتكرر ميدانياً. */
function captchaErrorMessage(error,captchaToken){
  var msg=(error.message||'').toLowerCase();
  if(!/captcha/i.test(msg))return 'تعذّر إرسال رمز التحقق، حاول مرة أخرى.';
  return captchaToken
    ? 'تعذّر التحقق الأمني من الخادم، حاول مرة أخرى بعد قليل.'
    : 'تعذّر الحصول على رمز الأمان من المتصفح، انتظر لحظة ثم حاول مرة أخرى.';
}

async function resendOtp(){
  var rs=document.getElementById('resend');
  if(rs){rs.disabled=true;rs.innerHTML='<span class="spinner"></span> جارٍ الإرسال...';}

  var captchaToken=await freshTurnstileToken(2500);
  var sb=await getSb();
  if(!sb){toast('تعذّر الاتصال بالخادم');if(rs)rs.disabled=false;return}

  var fullPhone='+966'+A.phone;
  var res=await sb.auth.signInWithOtp({phone:fullPhone,options:{captchaToken:captchaToken||undefined}});
  if(res.error){
    toast(captchaErrorMessage(res.error,captchaToken));
    if(rs)rs.disabled=false;
    return;
  }

  A.code='';A.err='';renderAuth();startTimer();toast('تم إرسال الرمز مرة أخرى');
}

async function doVerify(){
  var sb=await getSb();
  if(!sb){A.err='تعذّر الاتصال بالخادم.';renderAuth();return}

  A.verifying=true;renderAuth();

  var fullPhone='+966'+A.phone;
  var res=await sb.auth.verifyOtp({phone:fullPhone,token:A.code,type:'sms'});
  if(res.error){
    A.verifying=false;
    A.err='رمز التحقق غير صحيح أو منتهي الصلاحية. حاول مرة أخرى.';
    A.code='';
    renderAuth();
    return;
  }
  clearInterval(A.timer);
  await checkAccess();
}

/* ================= التحقق من الصلاحية + بيانات اللوحة =================
   لا ثقة بأي شيء غير merchant_members لـ auth.uid() الفعلي — لا بالرقم
   المُدخَل، ولا بأي معامل آخر. صف غير موجود = لا صلاحية، نقطة واحدة،
   بلا أي استثناء. لا إنشاء profile ولا صف merchant_members من هنا أبداً
   تحت أي ظرف — هذه الصفحة تقرأ فقط، لا تُسجِّل أحداً. */
var M={merchants:[],merchantNames:{},activeMerchantId:null,branches:[],devices:[],loading:false,approving:false,confirmRevokeId:null,
  settingsBranchId:null,settingsLoading:false,settingsDraft:null,settingsSaving:false,settingsSaveErr:'',
  pendingMode:null,pinInput:'',pinSaving:false,pinMsg:'',pinErr:'',
  holdServer:null,holdSector:null,loadedSector:null,
  posToken:null,posTokenConfirm:false,posTokenIssuing:false,posTokenErr:'',posConnections:null,
  view:'manage',inv:null,bk:null,bkConfirmCancelId:null};

/* الأقسام الستة بأسمائها العربية للعرض فقط. القسم واحد لكل تاجر
   (merchants.sector_code، راجع supabase-migration-unified-sectors.sql)؛
   branch_settings.sector_code مرآة له، وكتابتها من هنا تغيّر قسم التاجر
   لكل فروعه. SECTOR_HOLD_DEFAULTS = نفس قاعدة merchant_default_hold_days()
   في الخادم (اختبار db يقارنهما) — للاقتراح في الواجهة فقط، والخادم هو
   الذي يطبّق القاعدة فعلاً. */
var SECTOR_LABELS={grocery:'بقالة',retail:'تجزئة',cafe:'مقهى',restaurant:'مطعم',medical:'صحي',services:'خدمات'};
var SECTOR_HOLD_DEFAULTS={grocery:7,retail:7,cafe:0,restaurant:0,medical:0,services:0};
var SECTOR_KEYS=Object.keys(SECTOR_LABELS);
function holdDaysText(n){
  if(n===0)return 'بلا تعليق (فوري)';
  if(n===1)return 'يوم واحد';
  if(n===2)return 'يومان';
  return n+(n<=10?' أيام':' يوماً');
}

async function checkAccess(){
  var sb=await getSb();
  if(!sb)return;

  var memRes=await sb.from('merchant_members').select('merchant_id,role');
  if(memRes.error){
    // خطأ اتصال فعلي — لا نجزم "لا تملك صلاحية" لمعلومة لم تصل أصلاً.
    showNoAccess('تعذّر التحقق من صلاحيتك، تحقق من اتصالك وحاول مرة أخرى.',true);
    return;
  }
  if(!memRes.data||!memRes.data.length){
    showNoAccess('هذا الرقم غير مرتبط بأي حساب تاجر في نوج. تواصل مع فريق نوج إن كنت تتوقع صلاحية.',false);
    return;
  }

  M.merchants=memRes.data;
  var ids=M.merchants.map(function(m){return m.merchant_id});
  var namesRes=await sb.from('merchants').select('id,name').in('id',ids);
  M.merchantNames={};
  (namesRes.data||[]).forEach(function(m){M.merchantNames[m.id]=m.name});

  M.activeMerchantId=M.merchants[0].merchant_id;
  var authEl=document.getElementById('auth');
  authEl.style.display='none';authEl.innerHTML='';
  var noAccessEl=document.getElementById('noaccess');
  noAccessEl.style.display='none';noAccessEl.innerHTML='';
  document.getElementById('app').style.display='block';
  await loadDashboardData();
  resetIdleTimer();
}

function showNoAccess(message,retryable){
  var authEl=document.getElementById('auth');
  authEl.style.display='none';authEl.innerHTML='';
  var appEl=document.getElementById('app');
  appEl.style.display='none';appEl.innerHTML='';
  var el=document.getElementById('noaccess');
  el.style.display='flex';
  el.innerHTML='<div class="noaccess-box">'+
    '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'+
    '<h2>'+(retryable?'تعذّر التحقق':'لا تملك صلاحية وصول')+'</h2>'+
    '<p>'+escAttr(message)+'</p>'+
    (retryable?'<button class="cta" id="noAccessRetry" style="margin-top:20px">إعادة المحاولة</button>':'')+
    '<button class="'+(retryable?'ghost':'cta')+'" id="noAccessLogout" style="margin-top:'+(retryable?'6px':'20px')+'">تسجيل خروج</button>'+
  '</div>';
  var retry=document.getElementById('noAccessRetry');
  if(retry)retry.onclick=checkAccess;
  var b=document.getElementById('noAccessLogout');
  if(b)b.onclick=doLogout;
}

/* ================= الأجهزة =================
   اعتماد: approve_device_pairing() الموجودة أصلاً (RPC، تتحقق من عضوية
   المالك/الموظف داخلياً عبر auth.uid()). إلغاء: تحديث مباشر على devices
   عبر سياسة RLS الموجودة أصلاً ("merchant staff can manage their
   devices") — لا دالة جديدة لأي من الاثنين. */
async function loadDashboardData(){
  M.loading=true;renderApp();
  var sb=await getSb();
  if(!sb){M.loading=false;renderApp();return}

  var brRes=await sb.from('branches').select('id,name').eq('merchant_id',M.activeMerchantId);
  M.branches=brRes.data||[];

  var branchIds=M.branches.map(function(b){return b.id});
  if(branchIds.length){
    var devRes=await sb.from('devices').select('*').in('branch_id',branchIds).order('created_at',{ascending:false});
    M.devices=devRes.data||[];
  }else{
    M.devices=[];
  }

  M.loading=false;
  // تبديل التاجر/إعادة التحميل: فرع الإعدادات النشط يعود دوماً لأول فرع —
  // لا معنى لإبقاء معرّف فرع تاجر سابق، ولا لأي حالة PIN/توكن معلَّقة من
  // جلسة عرض سابقة (رمز لم يُحفَظ، توكن ظاهر من إصدار سابق...).
  M.settingsBranchId=M.branches.length?M.branches[0].id:null;
  M.settingsDraft=null;M.settingsSaveErr='';M.pendingMode=null;
  M.pinInput='';M.pinMsg='';M.pinErr='';
  M.posToken=null;M.posTokenConfirm=false;M.posTokenErr='';M.posConnections=null;
  renderApp();
  if(M.settingsBranchId)await loadBranchSettings(M.settingsBranchId);
}

/* يحمِّل صف branch_settings الحقيقي للفرع المختار في قسم "إعدادات الفرع" —
   مصدر واحد للقراءة، نفس الجدول الذي يقرأه/يكتبه kiosk.html تماماً، عبر
   سياسة RLS الموجودة أصلاً ("merchant staff can select/update their branch
   settings") بلا أي دالة جديدة لهذا الجزء. */
/* حالة اتصال الكاشير للفرع — قراءة فقط من pos_connections (سياسة RLS تسمح
   للمالك والموظف). فشل القراءة لا يعطّل أي قسم آخر: تبقى null فلا يُعرض شيء. */
async function loadPosConnections(branchId){
  var sb=await getSb();
  if(!sb){M.posConnections=null;return}
  var r=await sb.from('pos_connections').select('*').eq('branch_id',branchId);
  M.posConnections=r.error?null:(r.data||[]);
}

/* مدة تعليق النقاط على مستوى التاجر (merchants عام القراءة أصلاً) — تُقرأ
   مع إعدادات الفرع لأنها تُعرض وتُعدَّل في القسم نفسه (المالك فقط). فشل
   القراءة يُخفي الحقل فقط ولا يعطّل بقية الإعدادات. */
async function loadMerchantHold(){
  M.holdServer=null;M.holdSector=null;
  var sb=await getSb();
  if(!sb||!M.activeMerchantId)return;
  var r=await sb.from('merchants').select('id,sector_code,points_hold_days').eq('id',M.activeMerchantId).single();
  if(r.error||!r.data||typeof r.data.points_hold_days!=='number')return;
  M.holdServer=r.data.points_hold_days;
  M.holdSector=SECTOR_KEYS.indexOf(r.data.sector_code)!==-1?r.data.sector_code:(M.settingsDraft?M.settingsDraft.sector:null);
  if(M.settingsDraft)M.settingsDraft.holdDays=String(M.holdServer);
}
/* هل عدّل التاجر المدة يدوياً؟ = تختلف عن افتراض قسمه الحالي (نفس معيار الخادم). */
function holdIsCustom(){
  return M.holdServer!==null&&!!M.holdSector&&M.holdServer!==SECTOR_HOLD_DEFAULTS[M.holdSector];
}
function holdFieldHtml(d){
  if(activeRole()!=='owner'||M.holdServer===null)return '';
  var hint;
  if(d.sector!==M.holdSector){
    var nd=SECTOR_HOLD_DEFAULTS[d.sector];
    hint=holdIsCustom()
      ?'<div class="hint" id="holdHint">المدة الافتراضية لقسم '+SECTOR_LABELS[d.sector]+': '+holdDaysText(nd)+'. مدتك الحالية ('+holdDaysText(M.holdServer)+') عدّلتها يدوياً فلن تتغيّر تلقائياً.</div>'+
       '<button type="button" class="btn-outline" id="useDefaultHold" style="margin-top:8px">استخدام المدة الافتراضية ('+holdDaysText(nd)+')</button>'
      :'<div class="hint" id="holdHint">ستُطبَّق المدة الافتراضية لقسم '+SECTOR_LABELS[d.sector]+': '+holdDaysText(nd)+'.</div>';
  }else{
    hint='<div class="hint" id="holdHint">تبقى النقاط معلّقة هذه المدة قبل أن تصبح قابلة للاستبدال، لكل فروع التاجر. لا تتأثر النقاط المعلّقة حالياً بأي تغيير.</div>';
  }
  return '<label class="form-f"><label>مدة تعليق النقاط (بالأيام)</label>'+
    '<input type="number" inputmode="numeric" min="0" max="365" id="fHoldDays" value="'+escAttr(d.holdDays)+'">'+
    hint+'</label>';
}

async function loadBranchSettings(branchId){
  // رمز PIN/توكن POS معروضان مرتبطان بفرع بعينه — تبديل الفرع (حتى بلا
  // تبديل تاجر) يُسقطهما فوراً، فلا يبقى توكن ظاهر لفرع سابق معروضاً وهماً
  // أنه لا يزال يخص الفرع الجديد المختار.
  M.pinInput='';M.pinMsg='';M.pinErr='';
  M.posToken=null;M.posTokenConfirm=false;M.posTokenErr='';M.posConnections=null;
  M.settingsLoading=true;M.settingsSaveErr='';renderApp();
  var sb=await getSb();
  if(!sb){M.settingsLoading=false;renderApp();return}
  var res=await sb.from('branch_settings').select('*').eq('branch_id',branchId).single();
  M.settingsLoading=false;
  if(res.error||!res.data){
    M.settingsDraft=null;
    renderApp();return;
  }
  var row=res.data;
  M.settingsDraft={
    sector:SECTOR_KEYS.indexOf(row.sector_code)!==-1?row.sector_code:SECTOR_KEYS[0],
    bizName:row.biz_name||'',bizBranch:row.biz_branch||'',bizSlogan:row.biz_slogan||'',bizLogo:row.biz_logo||'',
    mode:row.pos_mode||'demo'
  };
  M.loadedSector=M.settingsDraft.sector;
  M.pendingMode=null;
  await loadMerchantHold();
  await loadPosConnections(branchId);
  renderApp();
}

function branchName(id){
  var b=M.branches.find(function(x){return x.id===id});
  return b?b.name:'—';
}

/* دور المستخدم في التاجر النشط حالياً — من نفس M.merchants التي قرأها
   checkAccess() أصلاً من merchant_members (merchant_id,role)، بلا أي
   استعلام إضافي. 'owner' فقط يرى قسمي رمز الإعدادات وتوكن POS (التحقق
   الحقيقي من الصلاحية في الخادم عبر الدالتين أنفسهما — هذا للعرض فقط). */
function activeRole(){
  var m=M.merchants.find(function(x){return x.merchant_id===M.activeMerchantId});
  return m?m.role:null;
}

function fmtDateTime(s){
  if(!s)return null;
  var d=new Date(s);
  function pad(n){return (n<10?'0':'')+n}
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());

/* ================= الفواتير =================
   قراءة فقط عبر merchant_list_invoices() (supabase-migration-merchant-
   invoices.sql): الدالة تتحقق من عضوية المستدعي بنفسها وتُرجع حالة العميل
   (مسجَّل/غير مسجَّل) فقط — لا رقم جوال ولا معرّف عميل يصل المتصفح أصلاً. كل
   تواريخ الفلترة بتوقيت الرياض (يُحسَب اليوم هنا بـIntl لا بتوقيت جهاز
   التاجر، فقد يختلف). لا يُحمَّل شيء حتى يفتح المستخدم تبويب "الفواتير". */
var INV_PAGE=25;
function riyadhToday(){
  var parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  var g={};parts.forEach(function(p){g[p.type]=p.value});
  return g.year+'-'+g.month+'-'+g.day;
}
function addDaysIso(iso,n){
  var p=iso.split('-');
  return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10);
}
function invRange(preset){
  var t=riyadhToday();
  if(preset==='7d')return {from:addDaysIso(t,-6),to:t};
  if(preset==='month')return {from:t.slice(0,8)+'01',to:t};
  return {from:t,to:t};
}
function newInvState(){
  var r=invRange('today');
  return {preset:'today',from:r.from,to:r.to,branchId:'',loading:false,loadingMore:false,err:'',customErr:'',summary:null,rows:[],hasMore:false,req:0};
}
function fmtNum(n){return Number(n||0).toLocaleString('en-US')}
function fmtMoneyHtml(n){
  return '<span class="num">'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'</span> <small>ر.س</small>';
}
var INV_SOURCE_LABELS={pos:'كاشير',manual:'يدوي',demo:'تجريبي'};

async function loadInvoices(append){
  var S=M.inv;
  if(!S||!M.activeMerchantId)return;
  var myReq=++S.req;
  if(append){S.loadingMore=true}else{S.loading=true;S.rows=[];S.summary=null;S.hasMore=false}
  S.err='';
  renderApp();
  var sb=await getSb();
  var res=sb?await sb.rpc('merchant_list_invoices',{
    p_merchant_id:M.activeMerchantId,p_from:S.from,p_to:S.to,
    p_branch_id:S.branchId||null,p_include_demo:false,
    p_limit:INV_PAGE,p_offset:append?S.rows.length:0
  }):{error:{message:'no-client'}};
  // رد متأخر لطلب سبقه طلب أحدث (تبديل فلتر سريع) أو لحالة أُهملت: يُتجاهَل.
  if(M.inv!==S||myReq!==S.req)return;
  S.loading=false;S.loadingMore=false;
  if(res.error||!res.data){
    S.err='تعذّر تحميل الفواتير، حاول مرة أخرى.';
    renderApp();return;
  }
  if(!append)S.summary=res.data.summary;
  S.rows=S.rows.concat(res.data.rows||[]);
  S.hasMore=!!res.data.has_more;
  renderApp();
}

function bindInvoices(){
  var S=M.inv;
  [].forEach.call(document.querySelectorAll('#viewTabs button'),function(b){
    b.onclick=function(){
      var v=b.getAttribute('data-view');
      if(v===M.view)return;
      M.view=v;
      if(v==='invoices'&&!M.inv){M.inv=newInvState();renderApp();loadInvoices(false);return}
      if(v==='bookings'&&!M.bk){M.bk=newBkState();renderApp();loadBookings();return}
      renderApp();
    };
  });
  if(!S||M.view!=='invoices')return;
  [].forEach.call(document.querySelectorAll('#invPresets button'),function(b){
    b.onclick=function(){
      var p=b.getAttribute('data-preset');
      S.preset=p;S.customErr='';
      if(p==='custom'){renderApp();return}
      var r=invRange(p);S.from=r.from;S.to=r.to;
      loadInvoices(false);
    };
  });
  var br=document.getElementById('invBranch');
  if(br)br.onchange=function(){S.branchId=br.value;loadInvoices(false)};
  var ap=document.getElementById('invApply');
  if(ap)ap.onclick=function(){
    var f=(document.getElementById('invFrom')||{}).value,t=(document.getElementById('invTo')||{}).value;
    if(!f||!t){S.customErr='اختر تاريخ البداية والنهاية.';renderApp();return}
    if(t<f){S.customErr='تاريخ النهاية قبل تاريخ البداية.';renderApp();return}
    S.from=f;S.to=t;S.customErr='';
    loadInvoices(false);
  };
  var more=document.getElementById('invMore');
  if(more)more.onclick=function(){if(!S.loadingMore)loadInvoices(true)};
  var retry=document.getElementById('invRetry');
  if(retry)retry.onclick=function(){loadInvoices(false)};
}

/* ================= الحجوزات (المطعم والخدمات) =================
   مبنية على نظام المواعيد الصحي نفسه (جدول appointments، راجع supabase-
   migration-reservations.sql): merchant_list_reservations() للقراءة (مالك
   وموظف — لا جوال كامل، فقط اسم العميل وآخر 4 أرقام)، merchant_set_
   reservation_status() للقبول/الإلغاء (مالك وموظف)، وmerchant_set_booking_
   enabled() لتفعيل/إيقاف استقبال الحجوزات (المالك فقط، وتتحقق الدالة من ذلك
   أيضاً). التبويب يظهر فقط لتاجر قسمه مطعم أو خدمات. لا يُحمَّل شيء قبل فتحه. */
var BOOKING_SECTORS=['restaurant','services'];
var BK_STATUS_LABELS={pending:'بانتظار القبول',confirmed:'مؤكَّد',cancelled:'ملغى',done:'منتهٍ'};
function bookingsTabVisible(){return BOOKING_SECTORS.indexOf(M.loadedSector)!==-1||M.view==='bookings'}
function newBkState(){return {loading:false,err:'',rows:null,bookingEnabled:null,sector:null,busyId:null,toggling:false,req:0}}
function bkErrorText(msg){
  msg=msg||'';
  if(/NOJ_INVALID_TRANSITION/.test(msg))return 'تغيّرت حالة هذا الحجز، حدّث القائمة.';
  if(/NOJ_BOOKING_NOT_AVAILABLE/.test(msg))return 'الحجوزات متاحة لقسمي المطعم والخدمات فقط.';
  if(/لا تملك صلاحية/.test(msg))return 'لا تملك صلاحية على هذا التاجر.';
  return 'تعذّر تنفيذ العملية، حاول مرة أخرى.';
}
async function loadBookings(){
  var S=M.bk;
  if(!S||!M.activeMerchantId)return;
  var myReq=++S.req;
  S.loading=true;S.err='';renderApp();
  var sb=await getSb();
  var res=sb?await sb.rpc('merchant_list_reservations',{p_merchant_id:M.activeMerchantId}):{error:{message:'no-client'}};
  if(M.bk!==S||myReq!==S.req)return;
  S.loading=false;
  if(res.error||!res.data){S.err='تعذّر تحميل الحجوزات، حاول مرة أخرى.';renderApp();return}
  S.rows=res.data.rows||[];
  S.bookingEnabled=!!res.data.booking_enabled;
  S.sector=res.data.sector_code;
  renderApp();
}
function bookingRowHtml(r){
  var detail=r.kind==='table'?'عدد الأشخاص: <b class="num">'+fmtNum(r.party_size)+'</b>':'الخدمة: <b>'+escAttr(r.service_type||'')+'</b>';
  var who=(r.customer_name?escAttr(r.customer_name):'عميل')+(r.customer_phone_last4?' · جوال ينتهي بـ <span class="num">'+escAttr(r.customer_phone_last4)+'</span>':'');
  var busy=M.bk&&M.bk.busyId===r.id;
  var actions='';
  if(r.status==='pending'){
    actions='<button type="button" class="approve-btn bk-accept" data-bk-accept="'+r.id+'"'+(busy?' disabled':'')+'>قبول</button>'+
      '<button type="button" class="btn-outline bk-cancel" data-bk-cancel="'+r.id+'"'+(busy?' disabled':'')+'>إلغاء</button>';
  }else if(r.status==='confirmed'){
    actions='<button type="button" class="btn-outline bk-cancel" data-bk-cancel="'+r.id+'"'+(busy?' disabled':'')+'>إلغاء</button>';
  }
  return '<div class="inv-row bk-row" data-bk-row="'+r.id+'">'+
    '<div class="inv-top"><b class="num">'+escAttr(r.scheduled_at_riyadh)+'</b>'+
      '<span class="badge '+(r.status==='confirmed'?'active':r.status==='pending'?'warn':'revoked')+'" data-bk-status>'+escAttr(BK_STATUS_LABELS[r.status]||r.status)+'</span></div>'+
    '<div class="inv-sub">'+detail+'</div>'+
    '<div class="inv-sub">'+who+'</div>'+
    (r.note?'<div class="inv-sub bk-note">ملاحظة: '+escAttr(r.note)+'</div>':'')+
    (actions?'<div class="bk-actions">'+actions+'</div>':'')+
  '</div>';
}
function bookingToggleHtml(S){
  if(S.bookingEnabled===null)return '';
  var on=S.bookingEnabled;
  var owner=activeRole()==='owner';
  return '<div class="card" id="bkToggleCard" style="margin-bottom:14px">'+
    '<div class="inv-top"><b>استقبال الحجوزات من تطبيق نوج</b>'+
      '<span class="badge '+(on?'active':'revoked')+'" id="bkEnabledBadge">'+(on?'مفعّل':'متوقف')+'</span></div>'+
    (owner
      ?'<p class="hint" style="margin:6px 0 10px">'+(on?'إيقافه يمنع الطلبات الجديدة فقط؛ الحجوزات القائمة تبقى هنا ويستطيع العميل إلغاءها.':'عند التفعيل يستطيع عملاؤك طلب حجز من تطبيق نوج، ويظهر هنا لتقبله أو تلغيه.')+'</p>'+
        '<button type="button" class="btn-outline" id="bkToggleBtn"'+(S.toggling?' disabled':'')+'>'+(S.toggling?'<span class="spinner" style="border-color:rgba(18,35,92,.25);border-top-color:var(--navy)"></span> جارٍ الحفظ...':(on?'إيقاف الحجوزات':'تفعيل الحجوزات'))+'</button>'
      :'<p class="hint" id="bkToggleOwnerOnly" style="margin-top:6px">تفعيل الحجوزات وإيقافها للمالك فقط.</p>')+
  '</div>';
}
function bookingsViewHtml(){
  var S=M.bk;
  if(!S)return '';
  var html='<div class="sec-h"><h2>الحجوزات</h2><button type="button" class="btn-outline" id="bkRefresh">تحديث</button></div>';
  if(S.loading&&!S.rows)return html+'<div class="loading-row" id="bkLoading">جارٍ التحميل...</div>';
  if(S.err&&!S.rows){
    return html+'<div class="card"><div class="form-warn" id="bkErr">'+escAttr(S.err)+'</div>'+
      '<button type="button" class="btn-outline" id="bkRetry" style="margin-top:10px">إعادة المحاولة</button></div>';
  }
  if(!S.rows)return html;
  if(BOOKING_SECTORS.indexOf(S.sector)===-1){
    return html+'<div class="card"><div class="empty" id="bkNotAvailable">الحجوزات متاحة لقسمي المطعم والخدمات فقط.</div></div>';
  }
  html+=bookingToggleHtml(S);
  if(S.err)html+='<div class="form-warn" id="bkErr" style="margin-bottom:10px">'+escAttr(S.err)+'</div>';
  var groups=[['pending','بانتظار القبول'],['confirmed','المؤكَّدة'],['cancelled','الملغاة']];
  var any=false;
  groups.forEach(function(g){
    var rows=S.rows.filter(function(r){return r.status===g[0]});
    if(!rows.length)return;
    any=true;
    html+='<div class="bk-group" id="bkGroup-'+g[0]+'"><div class="hint" style="margin:6px 2px 6px">'+g[1]+' (<span class="num">'+rows.length+'</span>)</div>'+
      '<div class="card">'+rows.map(bookingRowHtml).join('')+'</div></div>';
  });
  if(!any)html+='<div class="card"><div class="empty" id="bkEmpty">لا حجوزات قادمة.</div></div>';
  return html;
}
function bookingCancelConfirmHtml(){
  if(!M.bkConfirmCancelId)return '';
  return '<div class="ov" id="bkCancelOv"><div class="confirm-box">'+
    '<h3>إلغاء هذا الحجز؟</h3>'+
    '<p>سيظهر للعميل في تطبيق نوج أن الحجز أُلغي.</p>'+
    '<div class="confirm-row">'+
      '<button class="confirm-cancel" id="bkCancelBack">تراجع</button>'+
      '<button class="confirm-ok" id="bkCancelOk">إلغاء الحجز</button>'+
    '</div>'+
  '</div></div>';
}
async function setBookingStatus(id,status){
  var S=M.bk;
  if(!S)return;
  S.busyId=id;S.err='';renderApp();
  var sb=await getSb();
  var res=sb?await sb.rpc('merchant_set_reservation_status',{p_reservation_id:id,p_status:status}):{error:{message:'no-client'}};
  if(M.bk!==S)return;
  S.busyId=null;
  if(res.error||!res.data){S.err=bkErrorText(res.error&&res.error.message);renderApp();return}
  S.rows=S.rows.map(function(r){return r.id===id?res.data:r});
  renderApp();
  toast(status==='confirmed'?'تم قبول الحجز':'تم إلغاء الحجز');
}
function bindBookings(){
  var S=M.bk;
  if(!S||M.view!=='bookings')return;
  var refresh=document.getElementById('bkRefresh');
  if(refresh)refresh.onclick=function(){loadBookings()};
  var retry=document.getElementById('bkRetry');
  if(retry)retry.onclick=function(){loadBookings()};
  [].forEach.call(document.querySelectorAll('[data-bk-accept]'),function(b){
    b.onclick=function(){setBookingStatus(b.getAttribute('data-bk-accept'),'confirmed')};
  });
  [].forEach.call(document.querySelectorAll('[data-bk-cancel]'),function(b){
    b.onclick=function(){M.bkConfirmCancelId=b.getAttribute('data-bk-cancel');renderApp()};
  });
  var back=document.getElementById('bkCancelBack');
  if(back)back.onclick=function(){M.bkConfirmCancelId=null;renderApp()};
  var ok=document.getElementById('bkCancelOk');
  if(ok)ok.onclick=function(){var id=M.bkConfirmCancelId;M.bkConfirmCancelId=null;setBookingStatus(id,'cancelled')};
  var toggle=document.getElementById('bkToggleBtn');
  if(toggle)toggle.onclick=async function(){
    if(activeRole()!=='owner'||S.toggling)return;
    var want=!S.bookingEnabled;
    S.toggling=true;S.err='';renderApp();
    var sb=await getSb();
    var res=sb?await sb.rpc('merchant_set_booking_enabled',{p_merchant_id:M.activeMerchantId,p_enabled:want}):{error:{message:'no-client'}};
    if(M.bk!==S)return;
    S.toggling=false;
    if(res.error){S.err=bkErrorText(res.error.message);renderApp();return}
    S.bookingEnabled=!!res.data;
    renderApp();
    toast(S.bookingEnabled?'تم تفعيل الحجوزات':'تم إيقاف الحجوزات');
  };
}

  var el=document.getElementById('app');
  el.innerHTML=
    '<div class="topbar">'+
      '<div class="topbar-brand"><div class="mk">N</div>لوحة التاجر</div>'+
      '<div class="topbar-right">'+merchantSwitcherHtml()+
        '<button class="logout-btn" id="logoutBtn">خروج</button>'+
      '</div>'+
    '</div>'+
    '<div class="tabs" id="viewTabs">'+
      '<button type="button" data-view="manage" class="'+(M.view==='manage'?'on':'')+'">الإدارة</button>'+
      '<button type="button" data-view="invoices" class="'+(M.view==='invoices'?'on':'')+'">الفواتير</button>'+
      (bookingsTabVisible()?'<button type="button" data-view="bookings" class="'+(M.view==='bookings'?'on':'')+'">الحجوزات</button>':'')+
    '</div>'+
    (M.view==='invoices'?invoicesViewHtml():M.view==='bookings'?bookingsViewHtml():
    '<div class="sec-h"><h2>الأجهزة</h2></div>'+
    '<div class="card" style="margin-bottom:20px">'+devicesListHtml()+'</div>'+
    '<div class="sec-h"><h2>اعتماد شاشة نوج جديدة</h2></div>'+
    approveFormHtml()+
    '<div class="sec-h"><h2>إعدادات الفرع</h2></div>'+
    branchSettingsHtml()+
    adminPinHtml()+
    posTokenHtml())+
  confirmRevokeHtml()+modeConfirmHtml()+posTokenConfirmHtml()+bookingCancelConfirmHtml();

}

function bindApp(){
  var ms=document.getElementById('merchantSelect');
  if(ms)ms.onchange=async function(){
    M.activeMerchantId=ms.value;
    M.inv=null;M.bk=null;M.bkConfirmCancelId=null;
    await loadDashboardData();
    if(M.view==='invoices'){M.inv=newInvState();loadInvoices(false)}
    if(M.view==='bookings'){M.bk=newBkState();loadBookings()}
  };

  bindInvoices();
  bindBookings();

  var logout=document.getElementById('logoutBtn');
  if(logout)logout.onclick=doLogout;

  var pairCode=document.getElementById('pairCode');
  if(pairCode)pairCode.oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,6)};

  var approveBtn=document.getElementById('approveBtn');
  if(approveBtn)approveBtn.onclick=async function(){
    var code=(document.getElementById('pairCode')||{}).value||'';
    var branchId=(document.getElementById('pairBranch')||{}).value;
    if(!/^\d{6}$/.test(code)){
      M.approveErr='أدخل رمز إقران صحيحاً من 6 أرقام.';renderApp();return;
    }
    M.approving=true;M.approveErr='';renderApp();

    var sb=await getSb();
    var res=await sb.rpc('approve_device_pairing',{p_pairing_code:code,p_branch_id:branchId});
    M.approving=false;
    if(res.error){
      var msg=res.error.message||'';
      M.approveErr=/رمز الإقران غير صالح/.test(msg)?'رمز الإقران غير صالح أو استُخدم من قبل.'
        :/لا تملك صلاحية/.test(msg)?'لا تملك صلاحية على هذا الفرع.'
        :'تعذّر اعتماد الجهاز، حاول مرة أخرى.';
      renderApp();return;
    }
    await loadDashboardData();
    toast('تم اعتماد الجهاز بنجاح');
  };

  [].forEach.call(document.querySelectorAll('[data-revoke]'),function(b){
    b.onclick=function(){
      M.confirmRevokeId=b.getAttribute('data-revoke');
      renderApp();
    };
  });

  var revokeCancel=document.getElementById('revokeCancel');
  if(revokeCancel)revokeCancel.onclick=function(){M.confirmRevokeId=null;renderApp()};

  var revokeConfirm=document.getElementById('revokeConfirm');
  if(revokeConfirm)revokeConfirm.onclick=async function(){
    M.revoking=true;renderApp();
    var sb=await getSb();
    var res=await sb.from('devices').update({is_active:false,revoked_at:new Date().toISOString()}).eq('id',M.confirmRevokeId);
    M.revoking=false;M.confirmRevokeId=null;
    if(res.error){toast('تعذّر إلغاء الجهاز، حاول مرة أخرى');renderApp();return}
    await loadDashboardData();
    toast('تم إلغاء الجهاز');
  };

  var settingsBranchSelect=document.getElementById('settingsBranchSelect');
  if(settingsBranchSelect)settingsBranchSelect.onchange=async function(){
    M.settingsBranchId=settingsBranchSelect.value;
    await loadBranchSettings(M.settingsBranchId);
  };

  var pickLogoBtn=document.getElementById('pickLogoBtn');
  var fBizLogo=document.getElementById('fBizLogo');
  if(pickLogoBtn&&fBizLogo)pickLogoBtn.onclick=function(){fBizLogo.click()};
  if(fBizLogo)fBizLogo.onchange=function(){
    var file=fBizLogo.files&&fBizLogo.files[0];
    fBizLogo.value='';
    if(!file)return;
    var w=document.getElementById('logoWarn');
    if(!file.type||file.type.indexOf('image/')!==0){
      if(w)w.textContent='الرجاء اختيار ملف صورة صحيح';
      return;
    }
    if(file.size>500*1024){
      if(w)w.textContent='حجم الصورة كبير جداً (الحد الأقصى 500 كيلوبايت)';
      return;
    }
    if(w)w.textContent='';
    var reader=new FileReader();
    reader.onload=function(){
      M.settingsDraft.bizLogo=reader.result;
      renderApp();
    };
    reader.readAsDataURL(file);
  };
  var removeLogoBtn=document.getElementById('removeLogoBtn');
  if(removeLogoBtn)removeLogoBtn.onclick=function(){M.settingsDraft.bizLogo='';renderApp()};

  var fName=document.getElementById('fBizName');
  if(fName)fName.oninput=function(){M.settingsDraft.bizName=fName.value};
  var fBranch=document.getElementById('fBizBranch');
  if(fBranch)fBranch.oninput=function(){M.settingsDraft.bizBranch=fBranch.value};
  var fSlogan=document.getElementById('fBizSlogan');
  if(fSlogan)fSlogan.oninput=function(){M.settingsDraft.bizSlogan=fSlogan.value};

  [].forEach.call(document.querySelectorAll('#sectorSw button'),function(b){
    b.onclick=function(){
      // القسم للمالك فقط (merchant_set_sector يتحقق في الخادم أيضاً)
      if(activeRole()!=='owner')return;
      var d=M.settingsDraft,k=b.getAttribute('data-sector');
      d.sector=k;
      // مدة لم يعدّلها التاجر يدوياً تتبع افتراض القسم الجديد (كما يفعل
      // الخادم)؛ المعدّلة يدوياً تبقى، ويظهر الافتراض الجديد كاقتراح فقط.
      if(M.holdServer!==null&&!holdIsCustom()){
        d.holdDays=String(k===M.holdSector?M.holdServer:SECTOR_HOLD_DEFAULTS[k]);
      }
      renderApp();
    };
  });
  var fHoldDays=document.getElementById('fHoldDays');
  if(fHoldDays)fHoldDays.oninput=function(){M.settingsDraft.holdDays=fHoldDays.value};
  var useDefaultHold=document.getElementById('useDefaultHold');
  if(useDefaultHold)useDefaultHold.onclick=function(){
    M.settingsDraft.holdDays=String(SECTOR_HOLD_DEFAULTS[M.settingsDraft.sector]);renderApp();
  };

  // التحويل الفعلي للوضع في DRAFT لا يحدث هنا مباشرة — فقط يفتح تنبيه
  // التأكيد (modeConfirmHtml)، تماشياً مع "تنبيه واضح قبل التحويل".
  [].forEach.call(document.querySelectorAll('#modeSw button'),function(b){
    b.onclick=function(){
      var m=b.getAttribute('data-mode');
      if(m===M.settingsDraft.mode)return;
      M.pendingMode=m;renderApp();
    };
  });

  var modeConfirmCancel=document.getElementById('modeConfirmCancel');
  if(modeConfirmCancel)modeConfirmCancel.onclick=function(){M.pendingMode=null;renderApp()};
  var modeConfirmOk=document.getElementById('modeConfirmOk');
  if(modeConfirmOk)modeConfirmOk.onclick=function(){
    M.settingsDraft.mode=M.pendingMode;M.pendingMode=null;renderApp();
  };

  var settingsSaveBtn=document.getElementById('settingsSaveBtn');
  if(settingsSaveBtn)settingsSaveBtn.onclick=async function(){
    var d=M.settingsDraft;
    var wantHold=null;
    if(activeRole()==='owner'&&M.holdServer!==null){
      if(!/^\d{1,3}$/.test(String(d.holdDays).trim())||Number(d.holdDays)>365){
        M.settingsSaveErr='مدة تعليق النقاط يجب أن تكون رقماً صحيحاً من 0 إلى 365';renderApp();return;
      }
      wantHold=Number(d.holdDays);
    }
    M.settingsSaving=true;M.settingsSaveErr='';renderApp();
    var sb=await getSb();
    // القسم لا يُكتب عبر branch_settings (مرآة للقراءة فقط في الخادم) — بل
    // عبر merchant_set_sector للمالك بعد حفظ بقية الحقول.
    var res=await sb.from('branch_settings').update({
      biz_name:d.bizName||null,
      biz_branch:d.bizBranch||null,
      biz_slogan:d.bizSlogan||null,
      biz_logo:d.bizLogo||null,
      pos_mode:d.mode
    }).eq('branch_id',M.settingsBranchId);
    if(res.error){
      M.settingsSaving=false;
      M.settingsSaveErr='تعذّر حفظ الإعدادات، تحقق من اتصالك وحاول مرة أخرى';
      renderApp();return;
    }
    if(activeRole()==='owner'&&d.sector!==M.loadedSector){
      var sr=await sb.rpc('merchant_set_sector',{p_merchant_id:M.activeMerchantId,p_sector:d.sector});
      if(sr.error){
        M.settingsSaving=false;
        M.settingsSaveErr='حُفظت الإعدادات، لكن تعذّر تغيير القسم. حاول مرة أخرى.';
        renderApp();return;
      }
      M.loadedSector=d.sector;
    }
    if(wantHold!==null){
      // الخادم قد يكون طبّق افتراض القسم الجديد تلقائياً — نقرأ القيمة الفعلية
      // أولاً، ولا نستدعي الدالة إلا إن اختلفت عما يريده المالك.
      await loadMerchantHold();
      if(M.holdServer!==null&&M.holdServer!==wantHold){
        var hr=await sb.rpc('merchant_set_points_hold_days',{p_merchant_id:M.activeMerchantId,p_days:wantHold});
        if(hr.error){
          M.settingsSaving=false;
          M.settingsSaveErr='حُفظت الإعدادات، لكن تعذّر حفظ مدة تعليق النقاط. حاول مرة أخرى.';
          d.holdDays=String(wantHold);
          renderApp();return;
        }
        M.holdServer=hr.data;
      }
      if(M.holdServer!==null)d.holdDays=String(M.holdServer);
    }
    M.settingsSaving=false;
    renderApp();
    toast('تم حفظ الإعدادات بنجاح');
  };

  var pinInput=document.getElementById('pinInput');
  if(pinInput)pinInput.oninput=function(){
    this.value=this.value.replace(/\D/g,'').slice(0,4);
    M.pinInput=this.value;
  };
  var pinSaveBtn=document.getElementById('pinSaveBtn');
  if(pinSaveBtn)pinSaveBtn.onclick=async function(){
    M.pinMsg='';
    if(!/^\d{4}$/.test(M.pinInput)){
      M.pinErr='أدخل رمزاً من 4 أرقام بالضبط.';renderApp();return;
    }
    M.pinSaving=true;M.pinErr='';renderApp();
    var sb=await getSb();
    var res=await sb.rpc('merchant_set_admin_pin',{p_branch_id:M.settingsBranchId,p_pin:M.pinInput});
    M.pinSaving=false;
    // الرمز لا يُعاد عرضه أبداً بعد الحفظ — نجاحاً كان أو فشلاً.
    M.pinInput='';
    if(res.error){
      M.pinErr=/لا تملك صلاحية/.test(res.error.message||'')?'لا تملك صلاحية على هذا الفرع.':'تعذّر حفظ الرمز، حاول مرة أخرى.';
      renderApp();return;
    }
    M.pinMsg='تم حفظ الرمز بنجاح.';
    renderApp();
  };

  var posTokenIssueBtn=document.getElementById('posTokenIssueBtn');
  if(posTokenIssueBtn)posTokenIssueBtn.onclick=function(){M.posTokenConfirm=true;renderApp()};

  var posTokenConfirmCancel=document.getElementById('posTokenConfirmCancel');
  if(posTokenConfirmCancel)posTokenConfirmCancel.onclick=function(){M.posTokenConfirm=false;renderApp()};
  var posTokenConfirmOk=document.getElementById('posTokenConfirmOk');
  if(posTokenConfirmOk)posTokenConfirmOk.onclick=async function(){
    M.posTokenConfirm=false;M.posTokenIssuing=true;M.posTokenErr='';renderApp();
    var sb=await getSb();
    var res=await sb.rpc('merchant_issue_pos_token',{p_branch_id:M.settingsBranchId});
    M.posTokenIssuing=false;
    if(res.error){
      M.posTokenErr=/لا تملك صلاحية/.test(res.error.message||'')?'لا تملك صلاحية على هذا الفرع.':'تعذّر إصدار التوكن، حاول مرة أخرى.';
      renderApp();return;
    }
    M.posToken=res.data;
    await loadPosConnections(M.settingsBranchId);
    renderApp();
  };

  var posTokenCopyBtn=document.getElementById('posTokenCopyBtn');
  if(posTokenCopyBtn)posTokenCopyBtn.onclick=function(){
    try{
      navigator.clipboard.writeText(M.posToken).then(function(){toast('تم نسخ التوكن')},function(){toast('تعذّر النسخ، انسخه يدوياً')});
    }catch(e){toast('تعذّر النسخ، انسخه يدوياً')}
  };
}

async function doLogout(){
  var sb=await getSb();
  if(sb)await sb.auth.signOut();
  stopIdleTimer();
  M={merchants:[],merchantNames:{},activeMerchantId:null,branches:[],devices:[],loading:false,approving:false,confirmRevokeId:null,
    settingsBranchId:null,settingsLoading:false,settingsDraft:null,settingsSaving:false,settingsSaveErr:'',
    pendingMode:null,pinInput:'',pinSaving:false,pinMsg:'',pinErr:'',
    holdServer:null,holdSector:null,loadedSector:null,
    posToken:null,posTokenConfirm:false,posTokenIssuing:false,posTokenErr:'',posConnections:null,
    view:'manage',inv:null,bk:null,bkConfirmCancelId:null};
  A={phone:'',code:'',step:'phone',err:'',secs:0,timer:null};
  var appEl=document.getElementById('app');
  appEl.style.display='none';appEl.innerHTML='';
  var noAccessEl=document.getElementById('noaccess');
  noAccessEl.style.display='none';noAccessEl.innerHTML='';
  document.getElementById('auth').style.display='flex';
  renderAuth();
}

/* ================= مؤقت خمول =================
   30 دقيقة بلا أي تفاعل (نقرة أو كتابة) بينما اللوحة مفتوحة — جلسة
   Supabase نفسها تدوم أياماً (راجع التوثيق)، هذا المؤقت طبقة إضافية على
   جانب العميل فقط، أطول من مؤقت كشك الإعدادات (60 ثانية) لأن هذا جهاز
   شخصي للموظف/المالك، لا شاشة عامة. */
// window.__NOJ_IDLE_MS__: اختبار فقط (نفس نمط window.__NOJ_POLL_MS__ في
// kiosk.html) — لتقصير فترة الخمول في Playwright بدل انتظار 30 دقيقة
// حقيقية؛ غير معرَّفة أبداً خارج بيئة الاختبار فلا تغيّر شيئاً في الإنتاج.
var IDLE_MS=window.__NOJ_IDLE_MS__||30*60*1000;
var idleTimer=null;
function resetIdleTimer(){
  clearTimeout(idleTimer);
  if(document.getElementById('app').style.display==='none')return;
  idleTimer=setTimeout(function(){doLogout();toast('انتهت الجلسة بسبب الخمول')},IDLE_MS);
}
function stopIdleTimer(){clearTimeout(idleTimer);idleTimer=null}
document.addEventListener('click',resetIdleTimer);
document.addEventListener('input',resetIdleTimer);

/* ================= الإقلاع ================= */
async function boot(){
  var sb=await getSb();
  if(!sb){
    document.getElementById('auth').innerHTML='<div class="auth-inner"><div class="auth-body"><h2>تعذّر الاتصال بالخادم</h2><p>تحقق من اتصالك بالإنترنت وأعد تحميل الصفحة.</p></div></div>';
    return;
  }
  var sessionRes=await sb.auth.getSession();
  if(sessionRes.data&&sessionRes.data.session){
    await checkAccess();
  }else{
    renderAuth();
  }
}
boot();
</script>
