<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>NOJ — شاشة العميل</title>
<style>
  :root{
    --navy:#0F2350; --ink:#12235C;
    --blue:#2D7BF4; --blue-soft:#EAF1FE;
    --gold:#C99A2E; --gold-soft:#FBF3E2;
    --teal:#0F6E6E;
    --bg:#FFF; --panel:#F7F9FD; --line:#E9EEF7;
    --muted:#8A93AD; --muted-2:#A7AFC4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#0A0A0A;color:var(--ink);-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  h1,h2,h3,p{margin:0}

  /* device frame */
  .device{height:100dvh;padding:14px;display:flex}
  .screen{flex:1;background:var(--bg);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;position:relative}

  /* ===== HEADER ===== */
  .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px 30px 6px;flex-shrink:0}
  .noj{display:flex;align-items:center;gap:11px;direction:ltr;flex-shrink:0}
  .noj-m{width:46px;height:46px;border-radius:13px;border:3.5px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex-shrink:0}
  .noj-t b{display:block;font-size:31px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .noj-t small{display:block;font-size:9.5px;letter-spacing:1.9px;color:var(--navy);margin-top:4px;font-weight:600}

  .tagline{flex:1;text-align:center;padding-top:4px;min-width:0}
  .tagline p{font-size:23px;font-weight:800;line-height:1.55}
  .tagline .hl{color:var(--blue)}
  .tag-dot{margin:9px auto 0;width:190px;height:1.5px;background:var(--line);position:relative}
  .tag-dot::after{content:"";position:absolute;top:-2.5px;right:50%;transform:translateX(50%);width:6px;height:6px;border-radius:50%;background:var(--blue)}

  .biz{display:flex;align-items:center;gap:13px;flex-shrink:0;text-align:left}
  .biz-t b{display:block;font-size:24px;font-weight:800;white-space:nowrap}
  .biz-t small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
  .biz-l{width:60px;height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

  /* ===== BODY GRID ===== */
  .bd{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:16px;padding:14px 26px 0;overflow-y:auto}
  .bd::-webkit-scrollbar{width:0}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}

  /* left stat cards */
  .st-h{font-size:15.5px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:12px}
  .st-row{display:flex;align-items:center;gap:14px;justify-content:center}
  .st-i{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .st-v{font-size:34px;font-weight:800;color:var(--blue);line-height:1}
  .st-v.gold{color:var(--gold)}
  .st-sep{height:1px;background:var(--line);margin:16px 0}
  .st-lbl{font-size:15px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:6px}
  .st-big{font-size:60px;font-weight:800;color:var(--blue);text-align:center;line-height:1;direction:ltr}
  .st-sub{font-size:14px;font-weight:600;color:var(--muted);text-align:center;margin-top:8px}
  .st-link{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

  .queue-box{text-align:center}
  .q-top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
  .q-ico{width:52px;height:52px;border-radius:50%;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .q-num{font-size:74px;font-weight:800;color:var(--blue);line-height:.95;direction:ltr}

  /* center tap card */
  .tap{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:0}
  .tap h2{font-size:31px;font-weight:800;margin-bottom:14px}
  .nfc{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:transform .16s}
  .nfc:active{transform:scale(.96)}
  .halo{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(45,123,244,.16),rgba(45,123,244,.05) 55%,transparent 72%);animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.13);opacity:1}}
  .ring{position:absolute;width:150px;height:150px;border:2.5px solid rgba(45,123,244,.4);border-radius:50%;opacity:0;animation:ripple 2.6s cubic-bezier(.2,.6,.3,1) infinite}
  .ring.r2{animation-delay:.85s}.ring.r3{animation-delay:1.7s}
  @keyframes ripple{0%{transform:scale(.92);opacity:.75}100%{transform:scale(1.52);opacity:0}}
  .ph{width:104px;height:172px;border-radius:19px;border:4.5px solid var(--navy);background:#fff;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;animation:hover 3s ease-in-out infinite}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .ph::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:30px;height:4px;border-radius:99px;background:var(--line)}
  .tap-sub{font-size:19px;font-weight:600;color:var(--muted);margin-top:12px;text-align:center}
  .or{display:flex;align-items:center;gap:14px;width:100%;max-width:430px;margin:16px 0 12px}
  .or span{font-size:15px;color:var(--muted-2);font-weight:600}
  .or i{flex:1;height:1px;background:var(--line)}
  .pbtn{width:100%;max-width:430px;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:19px 22px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:21px;font-weight:800;transition:transform .16s,border-color .2s,box-shadow .2s}
  .pbtn:hover{border-color:var(--blue);box-shadow:0 8px 22px rgba(45,123,244,.1)}
  .pbtn:active{transform:scale(.98)}

  /* right column */
  .rb{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center}
  .rb-i{width:54px;height:54px;border-radius:15px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .rb b{display:block;font-size:19.5px;font-weight:800;line-height:1.45;margin-bottom:8px}
  .rb small{display:block;font-size:14px;color:var(--muted);line-height:1.65}
  .rb .brandblue{color:var(--blue);font-weight:800}
  .rb2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .rb2 .rb{padding:18px 12px}
  .rb2 .rb b{font-size:16px;margin-bottom:10px}
  .rb2 .rb small{font-size:12.5px}
  .mini-ph{width:56px;height:80px;border-radius:12px;border:3px solid var(--navy);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
  .badge{position:absolute;top:-8px;left:-8px;min-width:26px;height:26px;border-radius:99px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;direction:ltr}

  /* footer */
  .ft{display:flex;align-items:center;justify-content:space-around;gap:10px;padding:14px 26px 18px;border-top:1px solid var(--line);margin-top:14px;flex-shrink:0;flex-wrap:wrap}
  .ft-i{display:flex;align-items:center;gap:11px;min-width:0}
  .ft-i .ic{width:38px;height:38px;border-radius:11px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ft-i b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap}
  .ft-i small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
  .ft-d{width:1px;height:34px;background:var(--line);flex-shrink:0}

  /* ===== KEYPAD OVERLAY ===== */
  #layer{position:static;flex:0 0 auto}
  .ov{position:absolute;inset:0;background:rgba(255,255,255,.97);z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .25s ease both}
  .kp{width:100%;max-width:470px;text-align:center}
  .kp h2{font-size:29px;font-weight:800;margin-bottom:8px}
  .kp p{font-size:16.5px;color:var(--muted);margin-bottom:22px}
  .disp{background:var(--panel);border:2.5px solid var(--line);border-radius:18px;padding:20px;display:flex;align-items:center;justify-content:center;gap:13px;direction:ltr;margin-bottom:8px}
  .disp .cc{font-size:25px;font-weight:800;color:var(--muted)}
  .disp .dg{font-size:33px;font-weight:800;letter-spacing:3px;min-height:42px;display:flex;align-items:center}
  .disp .dg .plc{color:#C9CFDD}
  .car{width:3px;height:30px;background:var(--navy);margin-right:2px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .warn{font-size:14px;color:#DC2626;font-weight:700;margin-bottom:10px;min-height:20px}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .k{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:20px 0;font-size:27px;font-weight:800;min-height:66px;transition:transform .12s,background .15s}
  .k:active{transform:scale(.94);background:var(--panel)}
  .k.go{background:var(--navy);color:#fff;border-color:var(--navy);font-size:19px}
  .k.go:disabled{opacity:.34}
  .k.cl{background:var(--panel);color:var(--muted);font-size:18px}
  .close{position:absolute;top:20px;left:26px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:11px 20px;border-radius:99px}
  .close.inline{position:static;flex-shrink:0}

  /* ===== SUCCESS ===== */
  .ok{position:absolute;inset:0;background:#fff;z-index:25;display:flex;align-items:center;justify-content:center;padding:26px;animation:fade .3s ease both}
  .ok-in{text-align:center;max-width:760px;width:100%}
  .ok-c{width:118px;height:118px;border-radius:50%;background:#E7F7EF;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .55s cubic-bezier(.22,1.5,.36,1) both}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
  .ok-c svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s ease .3s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .ok h2{font-size:32px;font-weight:800;margin-bottom:9px}
  .ok p{font-size:17px;color:var(--muted);margin-bottom:24px}
  .got{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:700px){.got{grid-template-columns:1fr}}
  .g{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px 13px;animation:rise .4s ease both}
  .g:nth-child(2){animation-delay:.1s}.g:nth-child(3){animation-delay:.2s}
  .g-i{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .g b{display:block;font-size:16px;font-weight:800;margin-bottom:4px}
  .g small{display:block;font-size:12.5px;color:var(--muted);line-height:1.6}
  .tno{display:inline-flex;flex-direction:column;align-items:center;border:2.5px solid var(--blue);border-radius:20px;padding:15px 42px;margin-top:22px}
  .tno small{font-size:13.5px;color:var(--muted)}
  .tno b{font-size:42px;font-weight:800;color:var(--blue);direction:ltr;line-height:1.15}
  .timer{margin-top:18px;font-size:13.5px;color:var(--muted-2)}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* ===== ADMIN PIN (demo only) ===== */
  .pinbox{width:100%;max-width:380px;text-align:center}
  .pinbox h2{font-size:27px;font-weight:800;margin-bottom:8px}
  .pinbox p{font-size:15px;color:var(--muted);margin-bottom:22px}
  .pindots{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px}
  .pindot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);transition:background .15s,border-color .15s}
  .pindot.filled{background:var(--navy);border-color:var(--navy)}

  /* ===== ADMIN SETTINGS SCREEN (demo only) ===== */
  .admin{background:#fff;z-index:40;padding:0;align-items:stretch;justify-content:stretch}
  .adm{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
  .adm-hd{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:20px 30px;border-bottom:1px solid var(--line);flex-shrink:0}
  .adm-hd-t{display:flex;align-items:center;gap:10px}
  .adm-hd h2{font-size:22px;font-weight:800}
  .adm-body{flex:1;overflow-y:auto;padding:22px 30px;display:flex;flex-direction:column;gap:16px}
  .adm-body::-webkit-scrollbar{width:0}
  .adm-sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
  .adm-sec h3{font-size:13.5px;font-weight:800;color:var(--muted);margin-bottom:12px}
  .adm-f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px}
  .adm-f:last-child{margin-bottom:0}
  .adm-f input{display:block;width:100%;margin-top:6px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;color:var(--ink);font-family:inherit;direction:rtl}
  .adm-f input:focus{outline:none;border-color:var(--blue)}
  .adm-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:6px}
  .adm-testbtn{background:var(--navy);color:#fff;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:800;transition:transform .12s}
  .adm-testbtn:active{transform:scale(.96)}
  .adm-testbtn:disabled{opacity:.55}
  .conn-badge{font-size:13.5px;font-weight:800;padding:7px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);color:var(--muted)}
  .conn-badge.connected{color:#22A87A;border-color:#22A87A}
  .adm-note{font-size:12.5px;color:var(--muted-2);margin-top:10px;line-height:1.6}
  .adm-ft{display:flex;gap:12px;padding:16px 30px;border-top:1px solid var(--line);flex-shrink:0}
  .adm-ft button{flex:1;border-radius:16px;padding:15px;font-size:15.5px;font-weight:800;transition:transform .14s}
  .adm-ft button:active{transform:scale(.97)}
  .adm-ft .save{background:var(--navy);color:#fff}
  .adm-ft .cancel{background:#fff;color:var(--muted);border:1.5px solid var(--line)}

  .sw{display:flex;flex-wrap:wrap;gap:7px}
  .sw button{padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);white-space:nowrap}
  .sw button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  @media(max-width:1100px){
    .bd{grid-template-columns:1fr 1.3fr;gap:14px}
    .col.right{grid-column:1 / -1}
    .rb2{grid-template-columns:1fr 1fr}
    .tagline p{font-size:20px}
    .biz-t b{font-size:20px}
  }
  @media(max-width:820px){
    .bd{grid-template-columns:1fr}
    .col.right{grid-column:auto}
    .hd{flex-wrap:wrap;gap:12px}
    .tagline{order:3;flex-basis:100%}
    .ft{gap:14px}
    .ft-d{display:none}
    .adm-hd{padding:16px 20px}
    .adm-body{padding:16px 20px}
    .adm-ft{padding:14px 20px}
    .sw button{padding:8px 13px;font-size:12px}
  }
  @media(max-height:760px){
    .noj-m{width:40px;height:40px;font-size:21px}.noj-t b{font-size:26px}
    .tagline p{font-size:19px}
    .nfc{width:180px;height:180px}.ph{width:86px;height:142px}
    .halo{width:150px;height:150px}.ring{width:120px;height:120px}
    .tap h2{font-size:26px}.tap-sub{font-size:16px}
    .q-num{font-size:56px}.st-big{font-size:46px}
    .rb b{font-size:17px}
    .k{padding:15px 0;min-height:56px;font-size:24px}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="device"><div class="screen" id="screen"></div></div>

<script>
var P={
 nfc:'<path d="M8.5 15.5a5 5 0 000-7"/><path d="M12 18a9 9 0 000-12"/><path d="M5.2 13.4a2.4 2.4 0 000-2.8"/>',

 cutlery:'<path d="M6 2v5.5M8 2v5.5M10 2v5.5M6 7.5a2 2 0 004 0M8 7.5V21"/><path d="M18 2c-2.4 1.1-3.8 3.9-3.8 7s1.4 5.4 3.8 6.5"/><path d="M18 2v19"/>',
 gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'

/* ================= DEVICE SETTINGS (persisted) =================
   إعدادات الجهاز المحمية (القطاع، بيانات المنشأة، ربط نظام الكاشير،
   الوضع) — تُحفظ في localStorage فتبقى بعد إعادة تشغيل الجهاز. رمز
   الدخول (ADMIN_PIN) قيمة تجريبية ثابتة فقط، ولا يوجد أي مفتاح API أو
   بيانات اعتماد حقيقية في هذا الملف. */
var ADMIN_PIN='1234';
var SETTINGS_KEY='noj_kiosk_settings';
var DEFAULT_SETTINGS={sector:'medical',bizName:'',bizBranch:'',bizSlogan:'',pairingCode:'',posConnected:false,mode:'demo'};
function loadSettings(){
  try{
    var raw=localStorage.getItem(SETTINGS_KEY);
    if(!raw)return null;
    var parsed=JSON.parse(raw);
    return parsed&&typeof parsed==='object'?parsed:null;
  }catch(e){return null}
}
function saveSettingsToStorage(s){
  try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));return true}
  catch(e){console.error('NOJ kiosk: تعذّر حفظ الإعدادات',e);return false}
}
var SETTINGS=(function(){
  var saved=loadSettings()||{};
  var merged={};
  Object.keys(DEFAULT_SETTINGS).forEach(function(k){
    merged[k]=(k in saved)?saved[k]:DEFAULT_SETTINGS[k];
  });
  if(!T[merged.sector])merged.sector=DEFAULT_SETTINGS.sector;
  return merged;
})();
function escAttr(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function currentBiz(){
  var t=T[SETTINGS.sector];
  var name=SETTINGS.bizName?SETTINGS.bizName:t.biz;
  if(SETTINGS.bizBranch)name+=' - '+SETTINGS.bizBranch;
  var slogan=SETTINGS.bizSlogan?SETTINGS.bizSlogan:t.slogan;
  return {name:name,slogan:slogan};
}

var tmr=null,secs=0;
function renderMain(){
  document.getElementById('screen').innerHTML=main()+'<div id="layer"></div>';
  bindMain();
}
function renderLayer(){
  var el=document.getElementById('layer');
  if(!el)return;
  el.innerHTML=S.view==='pad'?keypad():S.view==='ok'?success():S.view==='pin'?adminPin():S.view==='settings'?settingsScreen():'';
  bindLayer();
  if(S.view==='ok')startTimer(12);else clearInterval(tmr);
  resetAdminIdle();
}
function render(){renderMain();renderLayer()}
function startTimer(s){
  clearInterval(tmr);secs=s;
  var el=document.getElementById('timer');
  if(el)el.textContent='العودة للشاشة الرئيسية خلال '+secs+' ثانية';
  tmr=setInterval(function(){
    secs--;
    var e=document.getElementById('timer');
    if(e)e.textContent='العودة للشاشة الرئيسية خلال '+secs+' ثانية';
    if(secs<=0){clearInterval(tmr);S.view='main';S.phone='';renderLayer()}
  },1000);
}
/* يحاكي إرسال الفاتورة إلى الخادم — يحمل حقل category ليصنَّف الإنفاق
   لاحقاً في تطبيق العميل (index.html). لا يوجد اتصال شبكة فعلي هنا؛ هذا
   تمثيل للحمولة (payload) التي سترسلها نقطة البيع الحقيقية مستقبلاً. */
function sendInvoice(){
  var c=C(),biz=currentBiz();
  var payload={category:c.category,merchant:biz.name,ticket:c.ticket,phone:S.phone||null,linked_at:new Date().toISOString()};
  console.log('NOJ kiosk → إرسال الفاتورة (محاكاة):',payload);
  return payload;
}

function bindMain(){
  var op=document.getElementById('openPad');
  if(op)op.onclick=function(){S.view='pad';S.phone='';renderLayer()};
  var nfc=document.querySelector('.nfc');
  if(nfc)nfc.onclick=function(){S.phone='';sendInvoice();S.view='ok';renderLayer()};
  var logo=document.getElementById('nojLogo');
  if(logo)bindLogoLongPress(logo);
}
function bindLayer(){
  var cl=document.getElementById('closePad');
  if(cl)cl.onclick=function(){S.view='main';S.phone='';renderLayer()};
  [].forEach.call(document.querySelectorAll('[data-k]'),function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-k');
      if(k==='del')S.phone=S.phone.slice(0,-1);
      else if(S.phone.length<9)S.phone+=k;
      renderLayer();
    }});
  var cf=document.getElementById('confirm');
  if(cf)cf.onclick=function(){
    if(S.phone.length===9&&S.phone[0]==='5'){sendInvoice();S.view='ok';renderLayer()}};
  bindPin();
  bindAdmin();
}

/* ================= ADMIN ACCESS (demo only) =================
   شاشة أعدادات الجهاز محمية عن العملاء: لا يوجد أي زر ظاهر لها. الدخول
   فقط عبر ضغط مطوّل 5 ثوانٍ على شعار NOJ، ثم رمز PIN من 4 أرقام
   (ADMIN_PIN أعلاه — قيمة تجريبية ثابتة، وليست سرّاً حقيقياً). خروج
   تلقائي للشاشة الرئيسية بعد 60 ثانية بلا أي تفاعل. */
var longPressTimer=null;
function bindLogoLongPress(el){
  var start=function(){
    clearTimeout(longPressTimer);
    longPressTimer=setTimeout(openPinScreen,5000);
  };
  var cancel=function(){clearTimeout(longPressTimer)};
  el.addEventListener('mousedown',start);
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchcancel',cancel);
}
function openPinScreen(){
  if(S.view!=='main')return;
  S.pin='';S.pinErr='';S.view='pin';
  renderLayer();
}

/* ================= ADMIN PIN SCREEN ================= */
function adminPin(){
  var filled=S.pin.length,dots='';
  for(var i=0;i<4;i++)dots+='<div class="pindot'+(i<filled?' filled':'')+'"></div>';
  var keys=['1','2','3','4','5','6','7','8','9'];
  return '<div class="ov" id="pinBox">'+
   '<button class="close" id="pinCancel">'+ic('close',16,'#8A93AD')+' إلغاء</button>'+
   '<div class="pinbox"><h2>إعدادات الجهاز</h2>'+
   '<p>أدخل رمز الدخول (4 أرقام)</p>'+
   '<div class="pindots">'+dots+'</div>'+

   '<div class="keys">'+keys.map(function(k){return '<button class="k" data-pk="'+k+'">'+k+'</button>'}).join('')+
   '<button class="k cl" data-pk="del">حذف</button>'+
   '<button class="k" data-pk="0">0</button>'+
   '</div></div></div>';
}
function bindPin(){
  var cancel=document.getElementById('pinCancel');
  if(cancel)cancel.onclick=function(){S.view='main';S.pin='';S.pinErr='';renderLayer()};
  [].forEach.call(document.querySelectorAll('[data-pk]'),function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-pk');
      if(k==='del'){S.pin=S.pin.slice(0,-1);S.pinErr='';renderLayer();return}
      if(S.pin.length<4)S.pin+=k;
      if(S.pin.length===4){
        if(S.pin===ADMIN_PIN){openAdminSettings()}
        else{S.pinErr='رمز غير صحيح، حاول مرة أخرى';S.pin='';renderLayer()}
        return;
      }
      renderLayer();
    };
  });
}

     '</div></div>'+
     '<div class="adm-sec"><h3>بيانات المنشأة</h3>'+
      '<label class="adm-f">الاسم<input type="text" id="fBizName" value="'+escAttr(d.bizName)+'" placeholder="'+escAttr(T[d.sector].biz)+'"></label>'+
      '<label class="adm-f">الفرع<input type="text" id="fBizBranch" value="'+escAttr(d.bizBranch)+'" placeholder="مثال: فرع العليا"></label>'+
      '<label class="adm-f">الشعار الفرعي<input type="text" id="fBizSlogan" value="'+escAttr(d.bizSlogan)+'" placeholder="'+escAttr(T[d.sector].slogan)+'"></label>'+
     '</div>'+
     '<div class="adm-sec"><h3>الربط بنظام الكاشير</h3>'+
      '<label class="adm-f">رمز الإقران (6 أرقام)<input type="text" inputmode="numeric" id="fPairing" value="'+escAttr(d.pairingCode)+'" placeholder="000000"></label>'+
      '<div class="adm-row"><button class="adm-testbtn" id="testConn">اختبار الاتصال</button>'+
      '<span class="conn-badge'+(d.posConnected?' connected':'')+'" id="connBadge">'+(d.posConnected?'● متصل':'○ غير متصل')+'</span></div>'+
      '<div class="warn" id="pairingWarn"></div>'+
      '<p class="adm-note">يُولَّد رمز الإقران من لوحة تحكم التاجر (Merchant Dashboard) عند ربط جهاز جديد بنظام الكاشير.</p>'+
     '</div>'+
     '<div class="adm-sec"><h3>الوضع</h3><div class="sw" id="adminMode">'+
      '<button data-m="demo" class="'+(d.mode==='demo'?'on':'')+'">تجريبي</button>'+
      '<button data-m="live" class="'+(d.mode==='live'?'on':'')+'">مباشر</button>'+
     '</div></div>'+
    '</div>'+
    '<div class="adm-ft"><button class="cancel" id="adminExit2">خروج من الإعدادات</button>'+
    '<button class="save" id="adminSave">حفظ</button></div>'+
   '</div></div>';
}
function updateConnBadge(){
  var el=document.getElementById('connBadge');
  if(el){
    el.className='conn-badge'+(DRAFT.posConnected?' connected':'');
    el.textContent=DRAFT.posConnected?'● متصل':'○ غير متصل';
  }
}
function bindAdmin(){
  var exit1=document.getElementById('adminExit');
  if(exit1)exit1.onclick=closeAdmin;
  var exit2=document.getElementById('adminExit2');
  if(exit2)exit2.onclick=closeAdmin;

  [].forEach.call(document.querySelectorAll('#adminSw button'),function(b){
    b.onclick=function(){DRAFT.sector=b.getAttribute('data-t');renderLayer()};
  });
  [].forEach.call(document.querySelectorAll('#adminMode button'),function(b){
    b.onclick=function(){DRAFT.mode=b.getAttribute('data-m');renderLayer()};
  });

  var fName=document.getElementById('fBizName');
  if(fName)fName.oninput=function(){DRAFT.bizName=fName.value};
  var fBranch=document.getElementById('fBizBranch');
  if(fBranch)fBranch.oninput=function(){DRAFT.bizBranch=fBranch.value};
  var fSlogan=document.getElementById('fBizSlogan');
  if(fSlogan)fSlogan.oninput=function(){DRAFT.bizSlogan=fSlogan.value};

  var fPairing=document.getElementById('fPairing');
  if(fPairing)fPairing.oninput=function(){
    var v=fPairing.value.replace(/\D/g,'').slice(0,6);
    if(v!==fPairing.value)fPairing.value=v;
    DRAFT.pairingCode=v;
    DRAFT.posConnected=false;
    updateConnBadge();
    var w=document.getElementById('pairingWarn');
    if(w)w.textContent='';
  };

  var testBtn=document.getElementById('testConn');
  if(testBtn)testBtn.onclick=function(){
    var w=document.getElementById('pairingWarn');
    if(!/^\d{6}$/.test(DRAFT.pairingCode||'')){
      DRAFT.posConnected=false;
      updateConnBadge();
      if(w)w.textContent='أدخل رمز إقران صحيحاً من 6 أرقام أولاً';
      return;
    }
    if(w)w.textContent='';
    testBtn.disabled=true;testBtn.textContent='جارٍ الاختبار...';
    setTimeout(function(){
      DRAFT.posConnected=true;
      testBtn.disabled=false;testBtn.textContent='اختبار الاتصال';
      updateConnBadge();
    },700);
  };

  var saveBtn=document.getElementById('adminSave');
  if(saveBtn)saveBtn.onclick=function(){
    SETTINGS=JSON.parse(JSON.stringify(DRAFT));
    var ok=saveSettingsToStorage(SETTINGS);
    S.t=SETTINGS.sector;
    closeAdmin();
    render();
    if(!ok)console.error('NOJ kiosk: فشل حفظ الإعدادات في localStorage');
  };
}

/* ================= IDLE TIMEOUT (pin/settings only) ================= */
var adminIdleTimer=null;
function resetAdminIdle(){
  clearTimeout(adminIdleTimer);
  if(S.view==='pin'||S.view==='settings'){
    adminIdleTimer=setTimeout(function(){
      DRAFT=null;S.pin='';S.pinErr='';S.view='main';
      renderLayer();
    },60000);
  }
}
document.addEventListener('click',resetAdminIdle);
document.addEventListener('input',resetAdminIdle);

render();
</script>
</body>
</html>
