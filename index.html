/* ================= PULL TO REFRESH ================= */
// الشاشة الرئيسية ومتاجري والولاء فقط — إعادة جلب كامل بيانات المستخدم
// (loadUserData يجلب الفواتير + الولاء + متاجري معًا في نداء واحد) عند
// سحب الصفحة للأسفل وهي في أعلى التمرير، مع مؤشر تحميل بسيط أعلى
// الشاشة (#ptr). يُبقي المحتوى الحالي ظاهرًا أثناء التحديث — بلا هياكل
// تحميل هنا، تلك خاصة بأول تحميل فقط (S.dataLoading).
(function(){
  var PTR_PAGES=['home','merchants','loyalty'];
  var RESISTANCE=.5,MAX_PULL=70,TRIGGER=50;
  var startY=null,pulling=false,dragged=0;

  function scrollTop(){return window.scrollY||document.documentElement.scrollTop||0}

  document.addEventListener('touchstart',function(e){
    if(S.dataLoading||S.refreshing)return;
    if(PTR_PAGES.indexOf(S.tab)===-1)return;
    if(scrollTop()>0)return;
    if(e.touches.length!==1)return;
    startY=e.touches[0].clientY;
    pulling=true;dragged=0;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!pulling||startY==null)return;
    var dy=e.touches[0].clientY-startY;
    if(dy<=0||scrollTop()>0){dragged=0;return}
    dragged=Math.min(dy*RESISTANCE,MAX_PULL);
    var el=document.getElementById('ptr');
    if(!el)return;
    el.classList.add('show','dragging');
    el.style.transform='translateY('+(dragged-50)+'px)';
    el.style.opacity=String(Math.min(1,dragged/TRIGGER));
  },{passive:true});

  document.addEventListener('touchend',function(){
    if(!pulling)return;
    pulling=false;
    var el=document.getElementById('ptr');
    var shouldRefresh=dragged>=TRIGGER;
    if(el){el.classList.remove('dragging');el.style.transform='';el.style.opacity=''}
    if(shouldRefresh)pullRefresh();
    else if(el)el.classList.remove('show');
    dragged=0;startY=null;
  },{passive:true});
})();

async function pullRefresh(){
  if(S.refreshing||!PROFILE.id)return;
  S.refreshing=true;
  var el=document.getElementById('ptr');
  if(el)el.className='ptr show loading';
  var ok=true;
  try{
    await loadUserData(PROFILE.id);
  }catch(e){
    console.error('NOJ pull-to-refresh error:',e);
    ok=false;
  }
  S.refreshing=false;
  render();
  el=document.getElementById('ptr');
  if(el)el.className='ptr';
  toast(ok?'تم تحديث البيانات':'تعذّر تحديث البيانات، حاول مرة أخرى');
}

// Aggregate (no-identity) waiting counts for one merchant's queue, fetched
// on demand when its detail page is opened rather than for every merchant
// up front. صحة merchants use the richer per-clinic get_merchant_clinics
// RPC instead (see prefetchMerchantQueueData below).
async function loadMerchantQueueStats(merchantId){
  try{
    var sb=await getSb();
    if(!sb){MERCHANT_QUEUE_STATS[merchantId]=[];return}
    var res=await sb.rpc('get_merchant_queue_stats',{p_merchant_id:merchantId});
    if(res.error) throw res.error;
    MERCHANT_QUEUE_STATS[merchantId]=res.data||[];
  }catch(e){
    console.error('NOJ queue stats error:',e);
    MERCHANT_QUEUE_STATS[merchantId]=[];
  }
}

// عيادات مركز صحي + إحصاء انتظار حي لكل عيادة (اسم، طبيب، الرقم الحالي،
// عدد المنتظرين، الوقت المتوقع) — تُجلب مرة واحدة وتُخزَّن مؤقتًا.
async function loadMerchantClinics(merchantId){
  try{
    var sb=await getSb();
    if(!sb){MERCHANT_CLINICS[merchantId]=[];return}
    var res=await sb.rpc('get_merchant_clinics',{p_merchant_id:merchantId});
    if(res.error) throw res.error;
    MERCHANT_CLINICS[merchantId]=(res.data||[]).map(function(row){
      return {clinicId:row.clinic_id,clinicName:row.clinic_name,doctorName:row.doctor_name,
        bookingEnabled:!!row.booking_enabled,nowServing:row.now_serving,
        waitingCount:Number(row.waiting_count),estMinutes:Number(row.est_minutes)};
    });
  }catch(e){
    console.error('NOJ clinics error:',e);
    MERCHANT_CLINICS[merchantId]=[];
  }
}

// مواعيد العميل القادمة (غير الملغاة) لدى مركز صحي معيّن.
async function loadMerchantAppointments(merchantId){
  try{
    var sb=await getSb();
    if(!sb){MERCHANT_APPOINTMENTS[merchantId]=[];return}
    var res=await sb.from('appointments').select('id, scheduled_at, clinics(name, doctor_name)')
      .eq('merchant_id',merchantId).eq('user_id',PROFILE.id).eq('status','confirmed').order('scheduled_at',{ascending:true});
    if(res.error) throw res.error;
    MERCHANT_APPOINTMENTS[merchantId]=(res.data||[]).map(function(row){
      return {id:row.id,clinicName:row.clinics?row.clinics.name:'عيادة',doctorName:row.clinics?row.clinics.doctor_name:null,scheduledAt:row.scheduled_at};
    });
  }catch(e){
    console.error('NOJ appointments error:',e);
    MERCHANT_APPOINTMENTS[merchantId]=[];
  }
}

// عند فتح صفحة متجر (شبكة الأقسام) أو الضغط على مربّع "الانتظار الذكي":
// صحّة تجلب عيادات المركز (تفيد كلًا من قسم الانتظار وقسم المواعيد معًا)،
// وغيرها يبقي على الإحصاء المجمَّع البسيط السابق دون تغيير.
function prefetchMerchantQueueData(m){
  if(!m)return;
  if(m.type==='صحة'){
    if(MERCHANT_CLINICS[m.merchantId]===undefined){
      loadMerchantClinics(m.merchantId).then(function(){if(S.selMerchant===m.merchantId)render()});
    }
  }else if(m.queueEnabled&&MERCHANT_QUEUE_STATS[m.merchantId]===undefined){
    loadMerchantQueueStats(m.merchantId).then(function(){if(S.selMerchant===m.merchantId)render()});
  }
}

// عند الضغط على مربّع "مواعيدي" لمركز صحي: يجلب عيادات المركز (لقائمة
// "حجز موعد جديد") ومواعيد العميل القادمة، كل واحدة إن لم تكن محمّلة بعد.
function prefetchMerchantHealthData(m){
  if(!m)return;
  if(MERCHANT_CLINICS[m.merchantId]===undefined){
    loadMerchantClinics(m.merchantId).then(function(){if(S.selMerchant===m.merchantId)render()});
  }
  if(MERCHANT_APPOINTMENTS[m.merchantId]===undefined){
    loadMerchantAppointments(m.merchantId).then(function(){if(S.selMerchant===m.merchantId)render()});
  }
}

document.getElementById('app').style.display='none';
document.querySelector('.nav').style.display='none';
document.getElementById('auth').style.display='none';

var hasSession=!!Store.get(K.SESSION,false);

setTimeout(function(){
  var sp=document.getElementById('splash');

  if(hasSession){
    hydrateFromStorage();
    // الشاشة الافتتاحية لها مدة ثابتة (~ثانيتان) بصرف النظر عن سرعة
    // الشبكة — لا تنتظر اكتمال جلب البيانات كما كان سابقًا؛ التطبيق يظهر
    // في موعده دائمًا، بهياكل تحميل (skeleton) إن لم تكن البيانات جاهزة
    // بعد، وتُستبدل بالمحتوى الحقيقي فور وصوله (انظر S.dataLoading).
    S.dataLoading=true;
    var loadPromise=loginAndLoad(A.phone);
    sp.classList.add('out');

    setTimeout(function(){
      var stage=sp.querySelector('.sp-stage');
      if(stage)stage.style.opacity='0';
    },380);

    setTimeout(function(){
      sp.style.display='none';
      document.getElementById('app').style.display='';
      document.querySelector('.nav').style.display='';
      render();
      loadPromise.then(function(ok){
        S.dataLoading=false;
        render();
        if(!ok)toast('تعذّر تحديث بياناتك، تُعرض آخر بيانات محفوظة');
      });
    },550);
    return;
  }

  var au=document.getElementById('auth');

  // build the login screen underneath while the splash is still visible
  au.style.display='';
  au.classList.add('enter');
  renderAuth();

  // begin the choreographed handoff
  sp.classList.add('out');

  // hide the splash's own logo just as the login logo lands in the same spot
  setTimeout(function(){
    var stage=sp.querySelector('.sp-stage');
    if(stage)stage.style.opacity='0';
  },380);

  setTimeout(function(){
    sp.style.display='none';
    au.classList.remove('enter');
  },550);
},1450);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js',{scope:'./index.html'}).catch(function(){});
  });
}
</script>
</body>
</html>
