<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>NOJ — No Ordinary Journey</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12235C">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOJ">
<style>
  :root{
    --navy:#12235C; --navy-2:#1B3A7A;
    --bg:#F7F8FC; --card:#FFFFFF; --line:#EDF0F7;
    --text:#12235C; --muted:#8A93AD;
    --purple:#7C5CE6; --blue:#3B82F6; --green:#22A87A; --orange:#F59E0B; --gray:#64748B;
    /* طابع زجاجي (glassmorphism): خلفيات/حدود شبه شفافة مبنية فوق --card
       الأصلي (أبيض خالص) بحيث يبقى التركيب أقرب ما يمكن لسطوعه الأصلي —
       هذا يحافظ على تباين النص كما كان تقريبًا رغم إضافة الضبابية والتدرّج. */
    --glass-bg:rgba(255,255,255,.8);
    --glass-border:rgba(255,255,255,.85);
    --glass-sheet-bg:rgba(255,255,255,.85);
    --glass-shadow:0 8px 28px rgba(18,35,92,.06);
    --glass-shadow-sm:0 2px 8px rgba(18,35,92,.05);
    --glass-blur:16px;
    --glass-blur-sm:8px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow-x:hidden}
  body{font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#FFFFFF 0%,#FBFCFE 45%,#F7F8FC 100%);color:var(--text)}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font:inherit}
  h1,h2,h3,p{margin:0}

  .app{max-width:480px;margin:0 auto;background:transparent;min-height:100vh;padding:0 20px calc(140px + env(safe-area-inset-bottom));position:relative}

  .head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
  .wordmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;direction:ltr;line-height:1;text-align:center}
  .head-right{display:flex;align-items:center;gap:8px}
  .mark{width:44px;height:44px;border-radius:12px;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;direction:ltr;flex-shrink:0;color:var(--navy);padding:0}
  .back-circle{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--glass-shadow-sm);transition:transform .16s cubic-bezier(.22,.9,.3,1)}
  .back-circle:active{transform:scale(.9)}
  .wordmark b{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .tagline{display:block;font-size:9px;letter-spacing:2.4px;color:var(--navy);margin-top:2px;direction:ltr}
  @media (max-width:370px){.tagline{font-size:7px;letter-spacing:1.2px}}
  .bell{position:relative}
  .bell i{position:absolute;top:8px;left:9px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:2px solid var(--bg)}

  .greet{margin-top:14px}
  .greet h1{font-size:26px;font-weight:800}
  .greet p{font-size:14px;color:var(--muted);margin-top:4px}

  .hero{margin-top:16px;border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;top:-55px;left:-55px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 70%);pointer-events:none}
  /* الرسم البياني وخطوط الشبكة يرتكزان على .hero-top (كتلة النص) لا على
     البطاقة كلها، فيبقيان خلف المبلغ دائمًا مهما تغيّر ارتفاع الزر أسفلها.
     overflow:hidden على الحاوية + عرض محصور (~58%) + mask-image تتلاشى
     نحو جهة الرقم (يمين البطاقة) تمنع تداخل طرف الخط مع الرقم مهما طال
     الرقم أو ضاق عرض الشاشة؛ طبقة النص (z-index:2) فوق الرسم (z-index:1)
     دائمًا بلا حاجة لهذا الضمان أصلاً، لكنه يبقي الخط بعيدًا بصريًا أيضًا. */
  .hero-top{position:relative;overflow:hidden;min-height:96px}
  .hero-grid{position:absolute;left:0;bottom:0;width:58%;height:86px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 34px);pointer-events:none;-webkit-mask-image:linear-gradient(to left,transparent 0%,#000 55%);mask-image:linear-gradient(to left,transparent 0%,#000 55%)}
  .spark{position:absolute;left:0;bottom:0;width:58%;height:86px;pointer-events:none;z-index:1;-webkit-mask-image:linear-gradient(to left,transparent 0%,#000 45%);mask-image:linear-gradient(to left,transparent 0%,#000 45%)}
  .hero-text{position:relative;z-index:2}
  .hero-label{font-size:13px;opacity:.7}
  .hero-amount{font-size:36px;font-weight:800;margin-top:8px;direction:ltr;text-align:right}
  .hero-amount s{text-decoration:none;font-size:15px;opacity:.7;font-weight:600;margin-right:4px}
  .hero-sub{font-size:13px;opacity:.7;margin-top:8px}
  .hero-delta{font-size:13px;font-weight:600;margin-top:6px}
  .hero-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;padding:13px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);margin-top:16px;position:relative;z-index:1}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .tile{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow-sm)}
  .tile span{font-size:10.5px;font-weight:600;line-height:1.35}
  .tile p{font-size:10px;color:var(--muted);line-height:1.45;min-height:2.6em;margin:0}
  @media (max-width:380px){.tile p{font-size:9px}}

  /* شبكة أقسام صفحة المتجر (متاجري): حتى 3 مربعات في الصف، تعيد ترتيب
     أعمدتها لكل صف على حدة حسب عدد عناصره فعليًا — فلا فراغات أيًا كان
     إجمالي عدد الأقسام المفعّلة (1..6). */
  .msec-grid{display:grid;gap:10px}
  .msec-grid+.msec-grid{margin-top:10px}
  .msec{position:relative;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow-sm)}
  .msec-ico{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .msec-dot{position:absolute;top:-1px;left:-1px;width:10px;height:10px;border-radius:50%;background:#EF4444;border:2px solid var(--card)}
  .msec b{font-size:12.5px;font-weight:800}
  .msec p{font-size:10px;color:var(--muted);line-height:1.45;min-height:2.9em}
  .msec-pts{font-size:17px;font-weight:800;color:var(--orange);direction:ltr}
  .msec-arrow{width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px;flex-shrink:0}

  .sec{margin-top:24px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sec-head h2{font-size:16px;font-weight:800}
  .sec-head button{font-size:12px;color:var(--blue);font-weight:600}

  .list{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;overflow:hidden;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow)}
  .row{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:right}
  .row + .row{border-top:1px solid var(--line)}
  .row-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--glass-border);backdrop-filter:blur(var(--glass-blur-sm));-webkit-backdrop-filter:blur(var(--glass-blur-sm))}
  .row-txt{flex:1;min-width:0}
  .row-txt b{display:block;font-size:14px;font-weight:700}
  .row-txt small{display:block;font-size:12px;color:var(--muted);margin-top:3px}

  .duo{display:grid;grid-template-columns:1fr;gap:12px;margin-top:24px}
  @media (min-width:430px){.duo{grid-template-columns:1fr 1fr}}
  .box{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;padding:14px;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow)}
  .box-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .box-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
  .box-head button{font-size:11px;color:var(--blue);font-weight:600;flex-shrink:0;white-space:nowrap}

  .donut-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
  .donut{border-radius:50%;position:relative;flex-shrink:0}
  .donut::after{content:"";position:absolute;inset:17px;border-radius:50%;background:var(--card)}
  .donut.lg::after{inset:22px}
  .donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
  .donut-mid b{font-size:15px;font-weight:800;line-height:1}
  .donut-mid small{font-size:10px;color:var(--muted)}
  .legend{flex:1;min-width:130px}
  .lg{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:7px}
  .lg:last-child{margin-bottom:0}
  .lg i{width:8px;height:8px;border-radius:3px;flex-shrink:0}
  .lg b{flex:1;font-weight:600}
  .lg s{text-decoration:none;color:var(--muted);font-weight:600}

  .inv-mini{display:flex;align-items:center;gap:14px}
  .inv-ico{width:56px;height:56px;border-radius:16px;background:rgba(238,243,255,.6);border:1px solid var(--glass-border);backdrop-filter:blur(var(--glass-blur-sm));-webkit-backdrop-filter:blur(var(--glass-blur-sm));display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .inv-info{flex:1;min-width:0}
  .inv-info b{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  .inv-info small{display:block;font-size:11px;color:var(--muted);line-height:1.6}
  .inv-info .amt{color:var(--text);font-weight:700;font-size:12px;direction:ltr;text-align:right}

  .loy{display:flex;align-items:center;gap:14px}
  .loy-ico{width:64px;height:64px;border-radius:18px;background:rgba(231,247,239,.6);border:1px solid var(--glass-border);backdrop-filter:blur(var(--glass-blur-sm));-webkit-backdrop-filter:blur(var(--glass-blur-sm));display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .loy-mid{flex:1;min-width:0}
  .loy-mid small{font-size:11px;color:var(--muted)}
  .loy-mid b{display:block;font-size:24px;font-weight:800;line-height:1.2}
  .loy-mid p{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
  .loy-right{text-align:left;flex-shrink:0}
  .loy-tier{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .loy-tier b{font-size:13px;font-weight:800;color:var(--orange)}
  .loy-badge{width:34px;height:34px;border-radius:50%;background:rgba(245,158,11,.82);border:1px solid var(--glass-border);backdrop-filter:blur(var(--glass-blur-sm));-webkit-backdrop-filter:blur(var(--glass-blur-sm));display:flex;align-items:center;justify-content:center}
  .loy-track{width:130px;height:8px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
  .loy-fill{height:100%;border-radius:99px;background:var(--orange)}
  .loy-num{font-size:10px;color:var(--muted);margin-top:5px;direction:ltr;text-align:left}

  /* صفحة الولاء: شبكة بطاقتين في الصف — شعار بالحرف الأول، اسم، رصيد، وشارة المكافآت المتاحة */
  .loy-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .loy-card{display:block;width:100%;padding:0;text-align:right;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;overflow:hidden;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow)}
  .loy-card-logo{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff}
  .loy-card-body{padding:12px}
  .loy-card-body b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loy-card-pts{font-size:16px;font-weight:800;color:var(--orange);margin-top:4px}

  .stats2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}

  .pill-search{position:relative;margin-bottom:14px}
  .pill-search svg{position:absolute;top:50%;right:14px;transform:translateY(-50%)}
  .pill-search input{width:100%;padding:12px 42px 12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;outline:none;color:var(--text)}
  .empty{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;padding:28px;text-align:center;font-size:14px;color:var(--muted);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow-sm)}

  .inv-amt{font-size:15px;font-weight:800;direction:ltr;flex-shrink:0}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:5px;display:inline-block}

  .qcard{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:20px;overflow:hidden;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow)}
  .qtop{padding:22px;text-align:center;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff}
  .qtop small{font-size:12px;opacity:.8;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:6px}
  .qnum{font-size:52px;font-weight:900;letter-spacing:2px;direction:ltr}
  .qstate{font-size:13px;font-weight:700;color:#FBBF24;margin-top:2px}
  .qbody{padding:18px;display:flex;flex-direction:column;gap:14px}
  .qrow{display:flex;justify-content:space-between;font-size:14px}
  .qrow span:first-child{color:var(--muted)}
  .qrow span:last-child{font-weight:700}
  .track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .fill{height:100%;border-radius:99px;background:var(--green);transition:width .4s}
  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;font-size:14px;font-weight:700;background:var(--navy);color:#fff}
  .note{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;padding:16px;margin-top:14px;font-size:13px;line-height:1.8;color:var(--muted);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow-sm)}
  .note b{color:var(--text)}

  .rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
  .rw + .rw{border-top:1px solid var(--line)}
  .rw b{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
  .rw small{font-size:12px;color:var(--muted)}
  .rw button{padding:9px 16px;border-radius:12px;font-size:12px;font-weight:700;flex-shrink:0}

  /* صفحة مكافآت المتجر: أيقونة نوع المكافأة + دائرة نقاط + زر استبدال بعرض كامل */
  .rwd{padding:16px}
  .rwd + .rwd{border-top:1px solid var(--line)}
  .rwd-top{display:flex;align-items:center;gap:12px}
  .rwd-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rwd-name{flex:1;min-width:0}
  .rwd-name b{display:block;font-size:14px;font-weight:700}
  .rwd-name small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .rwd-pts{width:50px;height:50px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
  .rwd-pts b{font-size:14px;font-weight:800;line-height:1}
  .rwd-pts small{font-size:8px;line-height:1;margin-top:1px}
  .rwd-btn{margin-top:12px}
  .rwd.locked{opacity:.6}

  .bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:6px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bfill{width:100%;max-width:26px;background:var(--navy);border-radius:7px 7px 0 0}
  .bcol small{font-size:10px;color:var(--muted)}
  .ins{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.7;padding:12px 0}
  .ins + .ins{border-top:1px solid var(--line)}
  .ins svg{flex-shrink:0;margin-top:2px}

  .ov{position:fixed;inset:0;z-index:60;background:rgba(10,20,50,.45);display:flex;align-items:flex-end;justify-content:center}
  /* عمود مرن بثلاثة أجزاء: رأس ثابت (sheet-head)، جسم قابل للتمرير
     (sheet-body) إن طال المحتوى، وتذييل ثابت مرئيًا دائمًا (sheet-foot) —
     يحمل الإجمالي أو زر التأكيد. max-height تمنع النافذة من تجاوز الشاشة
     أصلاً؛ overflow-y:auto على الجسم وحده هو ما يسمح بالتمرير الداخلي. */
  .sheet{width:100%;max-width:480px;max-height:min(85vh,640px);display:flex;flex-direction:column;background:var(--glass-sheet-bg);border:1px solid var(--glass-border);border-bottom:none;border-radius:22px 22px 0 0;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow)}
  .sheet-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:22px 22px 16px}
  .sheet-head h3{font-size:17px;font-weight:800}
  .sheet-body{flex:1;min-height:0;overflow-y:auto;padding:0 22px}
  .sheet-foot{flex-shrink:0;padding:16px 22px calc(22px + env(safe-area-inset-bottom))}
  .mrow{display:flex;justify-content:space-between;font-size:14px;padding:7px 0}
  .mrow span:first-child{color:var(--muted)}
  .mrow span:last-child{font-weight:600}
  .dash{border-top:1px dashed var(--line);margin:12px 0}
  .mtotal{display:flex;justify-content:space-between;align-items:center}
  .mtotal b{font-size:14px}
  .mtotal s{text-decoration:none;font-size:22px;font-weight:900;direction:ltr}

  .nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));margin:0 auto;width:calc(100% - 32px);max-width:448px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:32px;display:flex;padding:8px;z-index:50;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:0 14px 32px rgba(18,35,92,.16),0 2px 8px rgba(18,35,92,.06)}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:20px}
  .nav button.on{background:rgba(59,130,246,.14)}
  .nav span{font-size:10px;font-weight:600}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(14px);opacity:0;transition:.3s;z-index:70;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* profile */
  .prof-hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:20px;padding:24px;color:#fff;display:flex;align-items:center;gap:16px;margin-top:6px}
  .prof-av{width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex-shrink:0;backdrop-filter:blur(var(--glass-blur-sm));-webkit-backdrop-filter:blur(var(--glass-blur-sm))}
  .prof-id{flex:1;min-width:0}
  .prof-id b{display:block;font-size:19px;font-weight:800}
  .prof-id small{display:block;font-size:12px;opacity:.75;margin-top:3px;direction:ltr;text-align:right}
  .prof-tier{display:inline-flex;align-items:center;gap:5px;background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.45);color:#FBBF24;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;margin-top:8px}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .st{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:14px 8px;text-align:center;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--glass-shadow-sm)}
  .st b{display:block;font-size:18px;font-weight:800}
  .st small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .sw{width:42px;height:25px;border-radius:99px;background:var(--line);position:relative;flex-shrink:0;transition:background .22s}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.34,1.4,.64,1)}
  .sw.on{background:var(--green)}
  .sw.on::after{transform:translateX(-17px)}
  .logout{width:100%;padding:14px;border-radius:16px;background:#FEF2F2;color:#DC2626;font-weight:700;font-size:14px;margin-top:14px}
  .logout:active{transform:scale(.97)}

  /* ================= LOGIN ================= */
  .auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
  .auth-inner{max-width:480px;width:100%;margin:0 auto;padding:0 24px 40px;display:flex;flex-direction:column;min-height:100%}
  .auth-brand{text-align:center;padding:56px 0 8px}
  .auth-mark{width:72px;height:72px;border-radius:20px;border:4px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;margin:0 auto 14px;direction:ltr;animation:popIn .5s cubic-bezier(.22,.9,.3,1) both}
  .auth.enter .auth-mark{animation:none}
  .auth-brand b{font-size:34px;font-weight:800;letter-spacing:-.5px;direction:ltr;display:block}
  .auth-brand span{font-size:10px;letter-spacing:2.6px;color:var(--navy);direction:ltr;display:block;margin-top:3px}
  .auth-body{margin-top:36px;animation:fadeUp .4s ease both}
  .auth-body h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .auth-body p{font-size:14px;color:var(--muted);line-height:1.7}
  .field{margin-top:24px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .phone-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
  .phone-box:focus-within{border-color:var(--navy);box-shadow:0 0 0 4px rgba(18,35,92,.07)}
  .cc{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--text);padding-left:12px;border-left:1.5px solid var(--line);direction:ltr;flex-shrink:0}
  .phone-box input{flex:1;border:none;outline:none;background:none;padding:16px 0;font-size:17px;font-weight:600;letter-spacing:1px;direction:ltr;text-align:left;color:var(--text)}
  .phone-box input::placeholder{letter-spacing:1px;color:#C3C9D9;font-weight:500}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .err{font-size:12px;color:#DC2626;margin-top:10px;font-weight:600;animation:fadeIn .2s ease both}

  .otp-row{display:flex;gap:10px;direction:ltr;justify-content:center;margin-top:6px}
  .otp-row input{width:52px;height:60px;text-align:center;font-size:24px;font-weight:800;border:1.5px solid var(--line);border-radius:14px;background:var(--card);outline:none;color:var(--text);transition:border-color .18s,box-shadow .18s,transform .18s}
  .otp-row input:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(18,35,92,.07);transform:translateY(-2px)}
  .otp-row input.filled{border-color:var(--navy)}
  .otp-row.bad input{border-color:#DC2626;animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  .cta{width:100%;padding:16px;border-radius:16px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;margin-top:24px;transition:transform .16s,opacity .2s}
  .cta:active{transform:scale(.97)}
  .cta:disabled{opacity:.4;cursor:not-allowed}
  .ghost{width:100%;padding:14px;font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
  .ghost b{color:var(--blue)}
  .demo-tip{background:#FFF8E7;border:1px solid #F5E2B8;border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.7;color:#8A6D2B;margin-top:20px}
  .demo-tip b{color:#6B5316}
  .auth-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.8}

  /* ================= SPLASH (light) ================= */
  .splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .splash::before{content:"";position:absolute;width:min(120vw,700px);height:min(120vw,700px);border-radius:50%;background:radial-gradient(circle,rgba(124,92,230,.10),rgba(59,130,246,.07) 40%,transparent 68%);animation:auraDrift 6s ease-in-out infinite}
  .splash::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);background-size:250% 100%;background-position:200% 0;animation:sweepLight 1.1s cubic-bezier(.4,.1,.2,1) .25s}

  .sp-stage{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center;z-index:2;transition:opacity .14s ease}

  /* logo mark drawn as SVG stroke */
  .sp-mark{position:relative;z-index:3;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
  .sp-mark svg{position:absolute;inset:0;width:100%;height:100%}
  .sp-mark rect{fill:none;stroke:var(--navy);stroke-width:5;stroke-dasharray:360;stroke-dashoffset:360;animation:drawBox .5s cubic-bezier(.3,.8,.3,1) .075s forwards}
  .sp-n{font-size:52px;font-weight:800;color:var(--navy);direction:ltr;opacity:0;animation:nRise .3s cubic-bezier(.22,1.4,.36,1) .375s both}

  .sp-word{position:relative;z-index:3;text-align:center;margin-top:6px}
  .sp-letters{display:flex;justify-content:center;direction:ltr;gap:1px}
  .sp-letters i{font-style:normal;font-size:46px;font-weight:800;color:var(--navy);letter-spacing:-1px;display:inline-block;opacity:0;animation:letterDrop .275s cubic-bezier(.22,1.5,.36,1) both}
  .sp-letters i:nth-child(1){animation-delay:.5s}
  .sp-letters i:nth-child(2){animation-delay:.55s}
  .sp-letters i:nth-child(3){animation-delay:.6s}
  .sp-sub{font-size:10.5px;letter-spacing:4.5px;color:var(--muted);direction:ltr;margin-top:7px;opacity:0;animation:fadeUp .3s ease .675s both}
  .sp-rule{width:0;height:2px;border-radius:2px;background:linear-gradient(90deg,#7C5CE6,#3B82F6,#22A87A,#F59E0B);margin:16px auto 0;animation:ruleGrow .4s cubic-bezier(.3,.8,.3,1) .75s forwards}
  .sp-tag{position:relative;z-index:3;margin-top:14px;font-size:14.5px;font-weight:600;color:var(--text);opacity:0;animation:fadeUp .3s ease .85s both}

  .sp-load{position:absolute;bottom:60px;width:130px;height:3px;border-radius:99px;background:var(--line);overflow:hidden;z-index:3}
  .sp-load i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7C5CE6,#3B82F6);animation:loadBar 1.2s cubic-bezier(.35,.1,.2,1) .15s forwards}

  .splash.out{pointer-events:none}
  .splash.out::after{animation:none;opacity:0}
  .splash.out::before{animation:auraFade .28s ease forwards}
  /* supporting content clears out first */
  .splash.out .sp-word,.splash.out .sp-tag,.splash.out .sp-load{animation:liftAway .21s cubic-bezier(.5,0,.75,0) forwards}
  .splash.out .sp-tag{animation-delay:.02s}
  .splash.out .sp-load{animation-delay:.04s}
  /* the mark travels up to where the login logo will sit */
  .splash.out .sp-stage{animation:markTravel .39s cubic-bezier(.55,0,.2,1) .06s forwards}
  .splash.out .sp-mark rect{animation:boxSoften .39s cubic-bezier(.55,0,.2,1) .06s forwards}
  /* light wipe reveals the screen beneath */
  .splash.out .wipe{opacity:1;animation:wipeOpen .36s cubic-bezier(.5,0,.2,1) .09s forwards}
  .wipe{position:absolute;inset:0;background:var(--bg);opacity:0;z-index:1;clip-path:circle(150% at 50% 42%)}

  /* login screen rises to meet the mark */
  .auth.enter .auth-brand{animation:brandSettle .3s cubic-bezier(.22,1.2,.36,1) .17s both}
  .auth.enter .auth-body{animation:bodyRise .28s cubic-bezier(.22,.9,.3,1) .24s both}

  @keyframes liftAway{to{opacity:0;transform:translateY(-26px) scale(.94)}}
  @keyframes auraFade{to{opacity:0;transform:scale(1.5)}}
  @keyframes markTravel{
    0%{transform:translateY(0) scale(1)}
    100%{transform:translateY(calc(-50vh + 148px)) scale(.72)}
  }
  @keyframes boxSoften{to{stroke-width:4.2}}
  @keyframes wipeOpen{
    0%{clip-path:circle(0% at 50% 42%);opacity:1}
    100%{clip-path:circle(150% at 50% 42%);opacity:1}
  }
  @keyframes brandSettle{0%{opacity:0;transform:translateY(-16px) scale(1.08)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes bodyRise{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:translateY(0)}}

  @keyframes drawBox{to{stroke-dashoffset:0}}
  @keyframes nRise{0%{opacity:0;transform:translateY(16px) scale(.7)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes letterDrop{0%{opacity:0;transform:translateY(-22px) rotate(-8deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
  @keyframes auraDrift{0%,100%{transform:scale(1) translate(0,0);opacity:.75}50%{transform:scale(1.14) translate(2%,-2%);opacity:1}}
  @keyframes sweepLight{to{background-position:-60% 0}}
  @keyframes ruleGrow{to{width:120px}}
  @keyframes loadBar{to{width:100%}}

  .toast div{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 20px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

  /* ================= ANIMATIONS ================= */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{0%{opacity:0;transform:scale(.9)}60%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
  @keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes growBar{from{height:0}}
  @keyframes sweep{from{width:0}}
  @keyframes drawLine{to{stroke-dashoffset:0}}
  @keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.65}}
  @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(228,87,46,.5)}70%{box-shadow:0 0 0 14px rgba(228,87,46,0)}100%{box-shadow:0 0 0 0 rgba(228,87,46,0)}}
  @keyframes spinOnce{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes shimmer{100%{background-position:200% 0}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* view enters + staggered children */
  #view{animation:fadeIn .22s ease both}
  #view > *{animation:fadeUp .38s cubic-bezier(.22,.9,.3,1) both}
  #view > *:nth-child(1){animation-delay:.02s}
  #view > *:nth-child(2){animation-delay:.07s}
  #view > *:nth-child(3){animation-delay:.12s}
  #view > *:nth-child(4){animation-delay:.17s}
  #view > *:nth-child(5){animation-delay:.22s}
  #view > *:nth-child(6){animation-delay:.27s}
  #view > *:nth-child(7){animation-delay:.32s}

  .tiles .tile{animation:popIn .4s cubic-bezier(.22,.9,.3,1) both}
  .tiles .tile:nth-child(1){animation-delay:.10s}
  .tiles .tile:nth-child(2){animation-delay:.16s}
  .tiles .tile:nth-child(3){animation-delay:.22s}
  .tiles .tile:nth-child(4){animation-delay:.28s}

  .list .row,.list .rw,.list .rwd{animation:fadeUp .34s ease both}
  .list .row:nth-child(1),.list .rw:nth-child(1),.list .rwd:nth-child(1){animation-delay:.06s}
  .list .row:nth-child(2),.list .rw:nth-child(2),.list .rwd:nth-child(2){animation-delay:.12s}
  .list .row:nth-child(3),.list .rw:nth-child(3),.list .rwd:nth-child(3){animation-delay:.18s}
  .list .row:nth-child(4),.list .rw:nth-child(4),.list .rwd:nth-child(4){animation-delay:.24s}
  .list .row:nth-child(5),.list .rw:nth-child(5),.list .rwd:nth-child(5){animation-delay:.30s}
  .list .row:nth-child(6),.list .rw:nth-child(6),.list .rwd:nth-child(6){animation-delay:.36s}

  .loy-grid .loy-card{animation:fadeUp .34s ease both}
  .loy-grid .loy-card:nth-child(1){animation-delay:.06s}
  .loy-grid .loy-card:nth-child(2){animation-delay:.11s}
  .loy-grid .loy-card:nth-child(3){animation-delay:.16s}
  .loy-grid .loy-card:nth-child(4){animation-delay:.21s}
  .loy-grid .loy-card:nth-child(5){animation-delay:.26s}
  .loy-grid .loy-card:nth-child(6){animation-delay:.31s}

  .msec-grid .msec{animation:fadeUp .34s ease both}
  .msec-grid .msec:nth-child(1){animation-delay:.06s}
  .msec-grid .msec:nth-child(2){animation-delay:.11s}
  .msec-grid .msec:nth-child(3){animation-delay:.16s}

  /* press feedback */
  .tile,.row,.box,.hero-btn,.btn,.rw button,.loy-card,.msec,.nav button,.bell,.sec-head button{transition:transform .16s cubic-bezier(.22,.9,.3,1),box-shadow .2s ease,background .2s ease,opacity .2s ease}
  .tile:active,.row:active,.hero-btn:active,.rw button:active,.loy-card:active,.msec:active,.sec-head button:active{transform:scale(.96)}
  .btn:active{transform:scale(.97)}
  .bell:active{transform:scale(.9)}
  .tile:hover,.box:hover,.loy-card:hover,.msec:hover{box-shadow:0 6px 18px rgba(18,35,92,.07)}
  .row:hover{background:#FAFBFF}

  /* hero */
  .hero{animation:fadeUp .45s cubic-bezier(.22,.9,.3,1) both}
  .hero-amount{animation:popIn .5s cubic-bezier(.22,.9,.3,1) .08s both}
  .spark path{stroke-dasharray:420;stroke-dashoffset:420;animation:drawLine 1.4s cubic-bezier(.3,.8,.3,1) .25s forwards}
  .spark circle{animation:fadeIn .3s ease 1.5s both,floatY 3s ease-in-out 1.8s infinite}
  .bell i{animation:pulseDot 2.2s ease-in-out infinite}

  /* charts */
  .bfill{animation:growBar .7s cubic-bezier(.22,.9,.3,1) both;transform-origin:bottom}
  .bcol:nth-child(1) .bfill{animation-delay:.05s}
  .bcol:nth-child(2) .bfill{animation-delay:.12s}
  .bcol:nth-child(3) .bfill{animation-delay:.19s}
  .bcol:nth-child(4) .bfill{animation-delay:.26s}
  .bcol:nth-child(5) .bfill{animation-delay:.33s}
  .bcol:nth-child(6) .bfill{animation-delay:.40s}
  .donut{animation:popIn .55s cubic-bezier(.22,.9,.3,1) .1s both}
  .donut-mid{animation:fadeIn .4s ease .45s both}
  .lg{animation:fadeUp .3s ease both}
  .lg:nth-child(1){animation-delay:.20s}
  .lg:nth-child(2){animation-delay:.26s}
  .lg:nth-child(3){animation-delay:.32s}
  .lg:nth-child(4){animation-delay:.38s}
  .lg:nth-child(5){animation-delay:.44s}

  /* progress fills sweep in */
  .fill,.loy-fill{animation:sweep .8s cubic-bezier(.22,.9,.3,1) .15s both}
  .loy-badge{animation:popIn .5s cubic-bezier(.22,.9,.3,1) .2s both}

  /* queue */
  .qnum{animation:popIn .5s cubic-bezier(.22,.9,.3,1) .1s both}
  .qstate{animation:fadeIn .4s ease .3s both}
  .qtop.now .qnum{animation:popIn .5s cubic-bezier(.22,.9,.3,1) both,floatY 2s ease-in-out .5s infinite}
  .now-alert{animation:popIn .4s cubic-bezier(.22,.9,.3,1) both,ringPulse 2s ease-out .4s infinite}
  #qbtn:active svg{animation:spinOnce .5s ease}

  /* modal sheet */
  .ov{animation:fadeIn .2s ease both}
  .sheet{animation:slideUpSheet .32s cubic-bezier(.22,.9,.3,1) both}
  .sheet .mrow{animation:fadeUp .28s ease both}
  .sheet .mrow:nth-child(1){animation-delay:.06s}
  .sheet .mrow:nth-child(2){animation-delay:.10s}
  .sheet .mrow:nth-child(3){animation-delay:.14s}
  .sheet .mrow:nth-child(4){animation-delay:.18s}
  .sheet .mrow:nth-child(5){animation-delay:.22s}

  /* nav active lift */
  .nav button svg{transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
  .nav button.on svg{transform:translateY(-2px) scale(1.08)}
  .nav button:active svg{transform:scale(.88)}

  /* skeleton shimmer utility */
  .shimmer{background:linear-gradient(90deg,var(--line) 25%,#F6F8FF 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
  .sk-txt{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}

  /* pull-to-refresh */
  .ptr{position:fixed;top:70px;left:0;right:0;display:flex;align-items:center;justify-content:center;height:50px;transform:translateY(-50px);opacity:0;z-index:150;pointer-events:none;transition:transform .25s ease,opacity .25s ease}
  .ptr.dragging{transition:none}
  .ptr.show{transform:translateY(0);opacity:1}
  .ptr-ico{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--glass-shadow-sm);display:flex;align-items:center;justify-content:center}
  .ptr.loading .ptr-ico svg{animation:spinOnce .7s linear infinite}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }

  /* بديل للمتصفحات التي لا تدعم backdrop-filter: نعيد الخلفيات المصمتة
     الأصلية بدلاً من الزجاجية شبه الشفافة، حفاظًا على وضوح القراءة. */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    :root{
      --glass-bg:var(--card); --glass-border:var(--line);
      --glass-sheet-bg:var(--card);
      --glass-shadow:none; --glass-shadow-sm:none;
    }
    .inv-ico{background:#EEF3FF}
    .loy-ico{background:#E7F7EF}
    .loy-badge{background:var(--orange)}
  }
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="wipe"></div>
  <div class="sp-stage">
    <div class="sp-mark">
      <svg viewBox="0 0 104 104"><rect x="4" y="4" width="96" height="96" rx="26"/></svg>
      <span class="sp-n">N</span>
    </div>
  </div>
  <div class="sp-word">
    <div class="sp-letters"><i>N</i><i>O</i><i>J</i></div>
    <div class="sp-sub">NO ORDINARY JOURNEY</div>
    <div class="sp-rule"></div>
  </div>
  <div class="sp-tag">من الدفع تبدأ علاقتك المالية</div>
  <div class="sp-load"><i></i></div>
</div>

<div class="auth" id="auth"></div>

<div class="app" id="app">
  <div class="head">
    <div class="head-right">
      <button class="back-circle" id="profileBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12235C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </button>
      <button class="back-circle" id="headerBack" style="display:none"></button>
      <button class="bell back-circle" id="bell">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12235C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg>
        <i></i>
      </button>
    </div>
    <div class="wordmark"><b>NOJ</b><span class="tagline">No Ordinary Journey</span></div>
    <button class="mark" id="logoMark">N</button>
  </div>

function formatDate(iso){
  var d=new Date(iso);
  var dd=String(d.getDate()).padStart(2,'0');
  var mm=String(d.getMonth()+1).padStart(2,'0');
  return dd+'/'+mm+'/'+d.getFullYear();
}

// Arabic-aware fuzzy match: strips tashkeel/tatweel and normalizes alef/ya/ta
// marbuta variants so "الفرع" vs "الفرع" (differently typed) and spacing
// differences don't block an otherwise-matching search.
function normalizeAr(s){
  return (s||'').toString()
    .replace(/[ً-ٰٟۖ-ۭ]/g,'')
    .replace(/ـ/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

function computeCats(){
  var totals={};
  INVOICES.forEach(function(inv){totals[inv.c]=(totals[inv.c]||0)+inv.a});
  var total=0;
  Object.keys(totals).forEach(function(k){total+=totals[k]});
  CATS=Object.keys(CAT).filter(function(k){return totals[k]>0}).map(function(k){
    return {n:k,v:total>0?Math.round(totals[k]/total*100):0,a:Math.round(totals[k])};
  });
}

async function loadUserData(profileId){
  var sb=await getSb();
  var results=await Promise.all([
    sb.from('invoices').select('id, amount, category, items, created_at, merchant_id, merchants(name, branch)').eq('user_id',profileId).order('created_at',{ascending:false}),
    sb.from('queue_tickets').select('ticket_number, unit_name, position, est_minutes, merchant_id, merchants(name)').eq('user_id',profileId).eq('status','waiting').order('created_at',{ascending:false}).limit(1),
    sb.from('rewards').select('id, title, cost_points, merchant_id, merchants(name)').eq('active',true),
    sb.from('merchant_loyalty').select('merchant_id, points, tier, merchants(name, type, branch, logo_color)').eq('user_id',profileId)
  ]);
  var invRes=results[0],ticketRes=results[1],rewardRes=results[2],loyRes=results[3];
  if(invRes.error||ticketRes.error||rewardRes.error||loyRes.error) throw (invRes.error||ticketRes.error||rewardRes.error||loyRes.error);

  INVOICES=(invRes.data||[]).map(function(row){
    var mName=row.merchants?row.merchants.name+(row.merchants.branch?' - '+row.merchants.branch:''):'متجر';
    return {id:row.id,m:mName,d:formatDate(row.created_at),a:Number(row.amount),c:row.category,merchantId:row.merchant_id,
      items:(row.items||[]).map(function(it){return {n:it.n,p:it.p}})};
  });
  computeCats();

  // Each merchant's own balance row is the source of truth for what that
  // merchant's rewards cost against — rewards are grouped under the
  // merchant that owns them (rewards.merchant_id), never pooled together.
  MERCHANT_LOYALTY=(loyRes.data||[]).map(function(row){
    return {merchantId:row.merchant_id,name:row.merchants?row.merchants.name:'تاجر',
      type:row.merchants?row.merchants.type:'أخرى',branch:row.merchants?row.merchants.branch:null,
      logoColor:row.merchants?row.merchants.logo_color:null,
      points:Number(row.points),tier:row.tier,rewards:[]};
  });
  var rewardsByMerchant={};
  (rewardRes.data||[]).forEach(function(row){
    (rewardsByMerchant[row.merchant_id]=rewardsByMerchant[row.merchant_id]||[]).push({id:row.id,t:row.title,c:row.cost_points});
  });
  MERCHANT_LOYALTY.forEach(function(m){m.rewards=rewardsByMerchant[m.merchantId]||[]});

  if(ticketRes.data&&ticketRes.data[0]){
    var t=ticketRes.data[0];
    QUEUE={ticket:t.ticket_number,label:(t.merchants?t.merchants.name:'')+(t.unit_name?' - '+t.unit_name:''),merchantId:t.merchant_id,unitName:t.unit_name};
    S.q={ahead:t.position,min:t.est_minutes,now:t.position<=0};
  }

  await loadUserMerchants(profileId);
}

// "متاجري": every merchant the customer has ANY relationship with (an
// invoice, a loyalty balance, or both), enriched with the merchant-level
// feature flags (booking_enabled/queue_enabled) that decide which sections
// its detail page is allowed to show at all.
async function loadUserMerchants(profileId){
  var loyByMerchant={};
  MERCHANT_LOYALTY.forEach(function(m){loyByMerchant[m.merchantId]=m});
  var invoiceCounts={};
  INVOICES.forEach(function(inv){if(inv.merchantId)invoiceCounts[inv.merchantId]=(invoiceCounts[inv.merchantId]||0)+1});

  var merchantIds=Object.keys(invoiceCounts).concat(Object.keys(loyByMerchant));
  merchantIds=merchantIds.filter(function(id,idx){return id&&merchantIds.indexOf(id)===idx});
  if(!merchantIds.length){USER_MERCHANTS=[];return}

  var sb=await getSb();
  var merchRes=await sb.from('merchants').select('id, name, branch, type, booking_enabled, queue_enabled').in('id',merchantIds);
  if(merchRes.error) throw merchRes.error;

  USER_MERCHANTS=(merchRes.data||[]).map(function(row){
    return {merchantId:row.id,name:row.name,branch:row.branch,type:row.type,
      bookingEnabled:!!row.booking_enabled,queueEnabled:!!row.queue_enabled,
      invoiceCount:invoiceCounts[row.id]||0,loy:loyByMerchant[row.id]||null};
  });

  // ترتيب "متاجري": المركز الصحي أولاً دائمًا، ثم بقية المتاجر بترتيبها
  // الطبيعي (Array#sort ثابت/stable، فلا يُغيّر ترتيب غير الصحي فيما بينه).
  USER_MERCHANTS.sort(function(a,b){return (a.type==='صحة'?0:1)-(b.type==='صحة'?0:1)});
}

async function loginAndLoad(phone){
  try{
    var sb=await getSb();
    if(!sb) throw new Error('supabase-client-unavailable');

    var sessionRes=await sb.auth.getSession();
    var session=sessionRes.data&&sessionRes.data.session;
    if(!session){
      var signInRes=await sb.auth.signInAnonymously();
      if(signInRes.error) throw signInRes.error;
      session=signInRes.data.session;
    }
    if(!session) throw new Error('anonymous-signin-unavailable');

    var claimRes=await sb.rpc('claim_or_create_profile',{p_phone:phone});
    if(claimRes.error) throw claimRes.error;
    var prof=claimRes.data;

    PROFILE={id:prof.id,name:prof.name,phone:prof.phone,tier:prof.tier};

    await loadUserData(prof.id);
    return true;
  }catch(e){
    console.error('NOJ Supabase error:',e);
    return false;
  }
}

function donut(size,mid,big){
  let acc=0;
  const st=CATS.map(function(d){var f=acc;acc+=d.v;return CAT[d.n].c+' '+f+'% '+acc+'%'}).join(',');
  // conic-gradient() with zero color stops (no spending data yet) is invalid
  // and silently ignored by browsers, leaving an invisible/blank circle --
  // fall back to a flat neutral ring instead.
  const bg=st?('conic-gradient('+st+')'):'var(--line)';
  return '<div class="donut'+(big?' lg':'')+'" style="width:'+size+'px;height:'+size+'px;background:'+bg+'">'+(mid?'<div class="donut-mid"><b>'+mid.b+'</b><small>'+mid.s+'</small></div>':'')+'</div>';
}

// لا أرباح، فالمنطق معكوس عمدًا عن أي مؤشر مالي "صاعد=جيد" معتاد:
// نقص الإنفاق إيجابي (أخضر، سهم لأسفل)، وزيادته تنبيه (كهرماني لا أحمر،
// فزيادة الإنفاق ليست بالضرورة خطأ، والأحمر يوحي بخسارة/خطأ فعلي). لا
// يُعتمد على اللون وحده أبدًا: اتجاه السهم والنص يحملان المعنى نفسه،
// لوضوح الرسالة لمستخدمي عمى الألوان أيضًا.
function heroDeltaHtml(pct){
  if(pct===0)return '<div class="hero-delta" style="color:#94A3B8">— بدون تغيير عن الشهر الماضي</div>';
  if(pct<0)return '<div class="hero-delta" style="color:#22C55E">↓ أقل من الشهر الماضي '+Math.abs(pct)+'%</div>';
  return '<div class="hero-delta" style="color:#F59E0B">↑ أعلى من الشهر الماضي '+pct+'%</div>';
}

// Home screen: NEVER a pooled/spendable number (there is no NOJ-wide
// points pool). The headline is a plain COUNT of merchants you hold a
// balance with, and the caption names your top real per-merchant balances
// — every number shown stays attributed to one specific merchant. Tapping
// it opens the real per-merchant breakdown via the existing [data-go]
// click binding.
function loyTeaser(){
  var withBalance=MERCHANT_LOYALTY.filter(function(m){return m.points>0});
  var top=withBalance.slice().sort(function(a,b){return b.points-a.points}).slice(0,3);
  var sub=top.length
    ?top.map(function(m){return m.name+' '+m.points.toLocaleString('en-US')}).join(' · ')
    :'لم تجمع نقاطاً لدى أي تاجر بعد';
  return '<button class="box" data-go="loyalty" style="width:100%;text-align:right;display:block">'+
    '<div class="loy">'+
    '<div class="loy-ico">'+ic('gift',30,'#22A87A')+'</div>'+
    '<div class="loy-mid"><small>عدد المتاجر التي لديك رصيد فيها</small><b data-target="'+withBalance.length+'">'+withBalance.length.toLocaleString('en-US')+'</b>'+
    '<p>'+sub+'</p></div>'+
    '<div class="loy-right">'+ic('chevron',18,'#8A93AD')+'</div>'+
  '</div></button>';
}

// Loyalty page: one card per merchant, each with its own balance, tier,
// and rewards — mirrors the existing .box/.loy/.rw components exactly, just
// repeated per merchant instead of rendered once for a pooled total.
function merchantLoyCard(m){
  var cat=CAT[m.type]||CAT['أخرى'];
  var rewards=m.rewards||[];
  var cheapest=rewards.length?Math.min.apply(null,rewards.map(function(r){return r.c})):null;
  var progress=cheapest==null?'لا توجد مكافآت متاحة حالياً لدى هذا التاجر'
    :(m.points>=cheapest?'يمكنك استبدال مكافأة الآن لدى هذا التاجر':'أنت على بعد '+(cheapest-m.points)+' نقطة من أقرب مكافأة');
  var pct=cheapest?Math.min(100,m.points/cheapest*100):100;
  var num=cheapest!=null?(m.points.toLocaleString('en-US')+' / '+cheapest.toLocaleString('en-US')+' نقطة'):(m.points.toLocaleString('en-US')+' نقطة');
  return '<div class="box" style="margin-top:14px">'+
    '<div class="loy">'+
    '<div class="loy-ico">'+ic(cat.i,30,cat.c)+'</div>'+
    '<div class="loy-mid"><small>'+m.name+'</small><b data-target="'+m.points+'">'+m.points.toLocaleString('en-US')+'</b>'+
    '<p>'+progress+'</p></div>'+
    '<div class="loy-right"><div class="loy-tier"><b>المستوى ال'+m.tier+'</b><div class="loy-badge">'+ic('star',18,'#fff',2)+'</div></div>'+
    '<div class="loy-track"><div class="loy-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="loy-num">'+num+'</div></div>'+
    '</div>'+
    (rewards.length?'<div class="dash"></div>'+
      rewards.map(function(r){return '<div class="rw" style="padding:12px 0"><div><b>'+r.t+'</b><small>'+r.c+' نقطة</small></div>'+
        '<button data-rw="'+r.id+'" data-merchant="'+m.merchantId+'" style="background:'+(m.points>=r.c?'var(--navy)':'var(--line)')+';color:'+(m.points>=r.c?'#fff':'var(--muted)')+'">استبدال</button></div>'}).join('')
      :'')+
  '</div>';
}

// قائمة المنشآت التي تتيح الحجز المسبق (booking_enabled=true)، مفلترة بحقل
// البحث الخاص بهذه الشاشة — مستخرجة في دالة مستقلة حتى يستطيع مستمع البحث
// استبدال محتوى #bookList فقط دون إعادة بناء الشاشة كاملة.
function bookListHtml(){
  var q=normalizeAr(S.bookQuery);
  var list=USER_MERCHANTS.filter(function(m){return m.bookingEnabled}).filter(function(m){
    if(!q)return true;
    return normalizeAr(m.name+' '+(m.branch||'')).indexOf(q)>-1;
  });
  if(!list.length)return '<div class="empty">لا توجد منشآت مطابقة لبحثك</div>';
  return '<div class="list">'+list.map(function(m){
    var cat=CAT[m.type]||CAT['أخرى'];
    return '<button class="row" data-open-merchant="'+m.merchantId+'"><div class="row-ico" style="background:'+cat.c+'18">'+ic(cat.i,22,cat.c)+'</div>'+
      '<div class="row-txt"><b>'+m.name+(m.branch?' - '+m.branch:'')+'</b><small>'+m.type+'</small></div>'+ic('chevron',18,'#8A93AD')+'</button>';
  }).join('')+'</div>';
}

  '<div class="qbody">'+
    (q.now
      ?'<div class="now-alert" style="display:flex;gap:10px;align-items:center;background:#FEF2F2;padding:12px;border-radius:12px;font-size:13px;font-weight:600">'+ic('check',20,'#E4572E')+' تم إشعارك — لديك 3 دقائق قبل انتقال الدور</div>'

// قائمة المتاجر التي لدى العميل رصيد نقاط فيها، مفلترة بحقل البحث — دالة
// مستقلة حتى يستبدل مستمع البحث محتوى #loyList فقط دون إعادة رسم الشاشة.
// بطاقة شبكة الولاء: شعار بالحرف الأول على خلفية لون المتجر الفعلي
// (merchants.logo_color)، أو لون فئته إن لم يكن معرّفاً، ثم الاسم ورصيد
// النقاط وعدد المكافآت القابلة للاستبدال الآن فعلياً (النقاط كافية).
function loyaltyCardHtml(m){
  var cat=CAT[m.type]||CAT['أخرى'];
  var color=m.logoColor||cat.c;

  return '<button class="loy-card" data-open-loyalty="'+m.merchantId+'">'+
    '<div class="loy-card-logo" style="background:'+color+'">'+initial+'</div>'+

// قائمة "الولاء" الشبكية مفلترة بحقل البحث — دالة مستقلة حتى يستبدل مستمع

// أيقونة المكافأة حسب نوعها المُستنتج من عنوانها (لا عمود نوع مخصص في
// rewards) — خصم/نسبة، مشروب، أو هدية افتراضياً.
function rewardIcon(title){
  var t=title||'';
  if(t.indexOf('%')>-1||t.indexOf('خصم')>-1)return 'percent';
  if(t.indexOf('قهوة')>-1||t.indexOf('مشروب')>-1||t.indexOf('عصير')>-1||t.indexOf('كوب')>-1)return 'coffee';
  return 'gift';
}

// بطاقة مكافأة واحدة: أيقونة نوعها (أو قفل إن كانت النقاط غير كافية)،
// الاسم، دائرة النقاط المطلوبة، وزر استبدال — فعّال بالكامل عند توفر
// الرصيد، وباهت/معطّل مع نص "تحتاج X نقطة إضافية" عند عدم كفايته.
function rwdRowHtml(m,r){
  var cat=CAT[m.type]||CAT['أخرى'];
  var avail=m.points>=r.c;
  var need=r.c-m.points;
  return '<div class="rwd'+(avail?'':' locked')+'">'+
    '<div class="rwd-top">'+
      '<div class="rwd-ico" style="background:'+(avail?cat.c+'18':'var(--line)')+'">'+ic(avail?rewardIcon(r.t):'lock',22,avail?cat.c:'#8A93AD')+'</div>'+
      '<div class="rwd-name"><b>'+r.t+'</b>'+(avail?'':'<small>تحتاج '+need+' نقطة إضافية</small>')+'</div>'+
      '<div class="rwd-pts" style="background:'+(avail?'rgba(245,158,11,.14)':'var(--line)')+';color:'+(avail?'var(--orange)':'var(--muted)')+'"><b>'+r.c+'</b><small>نقطة</small></div>'+
    '</div>'+
    '<button class="btn rwd-btn" data-redeem="'+r.id+'" data-redeem-merchant="'+m.merchantId+'" style="background:'+(avail?'var(--navy)':'var(--line)')+';color:'+(avail?'#fff':'var(--muted)')+'"'+(avail?'':' disabled')+'>استبدال</button>'+
  '</div>';
}

function rwdListHtml(m){
  var rewards=m.rewards||[];
  if(!rewards.length)return '<div class="empty">لا توجد مكافآت متاحة حالياً لدى هذا التاجر</div>';
  return rewards.map(function(r){return rwdRowHtml(m,r)}).join('');
}

// صفحة مكافآت المتجر — تُفتح من بطاقة شبكة "الولاء". رأسها: أيقونة الفئة،
// الاسم، نوع النشاط، ثم رصيد النقاط وعدد الزيارات (من USER_MERCHANTS) في
// صفّين إحصائيين. استبدال مكافأة هنا يحدّث فقط #rwdList ورقم الرصيد
// #rwHdrPts (بلا render() كامل) — راجع مستمع [data-redeem] في bind().
// تُفتح إما من شبكة "الولاء" مباشرة (S.rewardsBack='loyalty') أو من مربّع
// "الولاء" داخل صفحة متجر معيّن في "متاجري" (S.rewardsBack='merchantDetail')
// — العنوان وزر الرجوع يتبادلان تبعًا لذلك، مطابقين اسم الشاشة التي
// سيُعاد إليها فعليًا (نفس مبدأ زر الرجوع في بقية شاشات التطبيق).
function merchantRewardsPage(){
  var m=MERCHANT_LOYALTY.filter(function(x){return x.merchantId===S.selMerchant})[0];
  var fromMerchantDetail=S.rewardsBack==='merchantDetail';
  if(!m){
    return '<div class="sec-head" style="margin-top:20px"><h2>المتجر</h2></div>'+
      '<div class="empty">هذا المتجر غير متاح</div>';
  }
  var cat=CAT[m.type]||CAT['أخرى'];
  var um=USER_MERCHANTS.filter(function(x){return x.merchantId===m.merchantId})[0];
  var visits=um?um.invoiceCount:0;
  var title=fromMerchantDetail?'الولاء':m.name;
  var header='<div class="box"><div class="loy">'+
    '<div class="loy-ico" style="background:'+cat.c+'18">'+ic(cat.i,30,cat.c)+'</div>'+
    '<div class="loy-mid"><small>'+m.type+'</small><b style="font-size:16px">'+m.name+'</b></div>'+
  '</div>'+
  '<div class="stats2">'+
    '<div class="st"><b id="rwHdrPts" style="color:var(--orange)">'+m.points.toLocaleString('en-US')+'</b><small>رصيد النقاط</small></div>'+
    '<div class="st"><b>'+visits+'</b><small>عدد الزيارات</small></div>'+
  '</div></div>';
  return '<div class="sec-head" style="margin-top:20px"><h2>'+title+'</h2></div>'+
    header+
    '<div class="sec"><div class="sec-head"><h2>المكافآت</h2></div>'+
    '<div class="list" id="rwdList">'+rwdListHtml(m)+'</div></div>'+
    (S.confirmRedeem&&S.confirmRedeem.merchantId===m.merchantId?redeemConfirmSheet(m):'');
}

// ورقة تأكيد قبل استبدال أي مكافأة — الاستبدال يخصم نقاطًا فعلية من رصيد
// العميل لدى هذا التاجر تحديدًا عبر redeem_reward RPC، ولا يمكن التراجع
// عنه، فلا يُنفَّذ مباشرة من ضغطة زر واحدة (نفس مبدأ تأكيد "مسح البيانات").
function redeemConfirmSheet(m){
  var r=(m.rewards||[]).filter(function(x){return String(x.id)===String(S.confirmRedeem.rewardId)})[0];
  if(!r)return '';
  return '<div class="ov" id="ovRedeem"><div class="sheet" id="sheetRedeem">'+
    '<div class="sheet-head"><h3>استبدال المكافأة؟</h3><button id="clsRedeem">'+ic('x',18,'#12235C')+'</button></div>'+
    '<div class="sheet-body"><div style="font-size:13px;color:var(--muted);line-height:1.8">سيتم خصم <b style="color:var(--text)">'+r.c.toLocaleString('en-US')+' نقطة</b> من رصيدك لدى '+m.name+' مقابل "'+r.t+'". لا يمكن التراجع عن هذا الإجراء.</div></div>'+
    '<div class="sheet-foot"><button class="btn" id="confirmRedeemBtn">تأكيد الاستبدال</button></div>'+
  '</div></div>';
}

// "متاجري": every merchant the customer has any relationship with (an
// invoice, a loyalty balance, or both) — built into USER_MERCHANTS by
// loadUserMerchants(). Tapping a card opens merchantDetail() for it.
// قائمة "متاجري" مفلترة بحقل البحث (الاسم أو الفرع أو نوع النشاط) — دالة
// مستقلة حتى يستبدل مستمع البحث محتوى #merchList فقط دون إعادة رسم الشاشة.
function merchantsListHtml(){
  var q=normalizeAr(S.merchQuery);
  var list=USER_MERCHANTS.filter(function(m){
    if(!q)return true;
    return normalizeAr(m.name+' '+(m.branch||'')+' '+m.type).indexOf(q)>-1;
  });
  if(!list.length)return '<div class="empty">لا توجد متاجر مطابقة لبحثك</div>';
  return '<div class="list">'+list.map(function(m){
    var cat=CAT[m.type]||CAT['أخرى'];
    var hasActiveQueue=QUEUE.merchantId===m.merchantId&&QUEUE.ticket!=null;
    var bits=[];
    if(m.loy)bits.push(m.loy.points.toLocaleString('en-US')+' نقطة');
    bits.push(m.invoiceCount+' '+(m.invoiceCount===1?'فاتورة':'فواتير'));
    if(hasActiveQueue)bits.push('دور نشط الآن');
    return '<button class="row" data-open-merchant="'+m.merchantId+'"><div class="row-ico" style="background:'+cat.c+'18">'+ic(cat.i,22,cat.c)+'</div>'+
      '<div class="row-txt"><b>'+m.name+(m.branch?' - '+m.branch:'')+'</b><small>'+bits.join(' · ')+'</small></div>'+ic('chevron',18,'#8A93AD')+'</button>';
  }).join('')+'</div>';
}

function merchantsPage(){
  if(S.dataLoading)return merchantsSkeleton();
  if(!USER_MERCHANTS.length){
    return '<div class="sec-head" style="margin-top:20px"><h2>متاجري</h2></div>'+
      emptyState('لم تتعامل مع أي متجر بعد','اربط جوالك عند أي متجر تزوره ليظهر هنا تلقائيًا بفواتيره ونقاطه');
  }
  return '<div class="sec-head" style="margin-top:20px"><h2>متاجري</h2></div>'+
    '<div class="pill-search">'+ic('search',16,'#8A93AD')+'<input id="merchQ" placeholder="ابحث بالاسم أو الفرع أو النشاط..." value="'+S.merchQuery+'"></div>'+
    '<div id="merchList">'+merchantsListHtml()+'</div>';
}

// اسم/وصف قسم الحجز يتغيّران حسب قطاع نشاط التاجر (merchants.type) بدل
// تسمية ثابتة واحدة — نفس القسم منطقيًا (booking_enabled)، فقط عنوانه
// يخاطب القطاع فعليًا.
const BOOKING_COPY={
  'صحة':{label:'مواعيدي',desc:'احجز أو استعرض مواعيدك القادمة'},
  'مطاعم':{label:'حجز طاولة',desc:'احجز طاولتك مسبقًا وتجنّب الانتظار'},
  'مقاهي':{label:'حجز مسبق',desc:'اطلب أو احجز مسبقًا'}
};
function bookingCopyFor(type){return BOOKING_COPY[type]||{label:'الحجز المسبق',desc:'احجز موعدك مسبقاً وتجنّب الانتظار'}}

// الأقسام الستة الممكنة لصفحة متجر داخل "متاجري". قسم لم يُفعّله التاجر لا
// يُدرَج في القائمة إطلاقًا (لا معطّل ولا مقفل — ببساطة غير موجود في
// الشبكة). "العروض" لا يوجد له مصدر بيانات في قاعدة البيانات بعد (لا
// عمود ولا جدول)، فيبقى غائبًا دائمًا حتى تُضاف بياناته.
function merchantSectionsList(m,myInvoices){
  var sections=[];
  if(m.loy){
    sections.push({key:'loyalty',label:'الولاء',icon:'gift',color:'#F59E0B',
      desc:'تابع رصيد نقاطك واستبدل أحدث المكافآت',pts:m.loy.points});
  }
  if(myInvoices.length){
    sections.push({key:'invoices',label:'فواتيري',icon:'receipt',color:'#3B82F6',
      desc:'راجع كل فواتيرك لدى هذا المتجر'});
  }
  if(m.bookingEnabled){
    var bc=bookingCopyFor(m.type);
    sections.push({key:'booking',label:bc.label,icon:'check',color:'#22A87A',desc:bc.desc});
  }
  if(m.queueEnabled){
    sections.push({key:'queue',label:'الانتظار الذكي',icon:'clock',color:'#7C5CE6',
      desc:'تابع حالة الانتظار المباشرة الآن'});
  }
  // التنبيهات: تُفعَّل فقط عند وجود تنبيه حقيقي مرتبط تحديدًا بهذا التاجر
  // (ALERTS[i].merchantId === هذا التاجر) — لا تخمين بمطابقة نصية.
  if(ALERTS.some(function(a){return a.merchantId===m.merchantId})){
    sections.push({key:'alerts',label:'التنبيهات',icon:'bell',color:'#3B82F6',alert:true,
      desc:'آخر التنبيهات والتحديثات من هذا المتجر'});
  }
  // العروض: لا مصدر بيانات بعد (لا عمود ولا جدول)، فلا تُدرَج أبدًا مهما
  // كانت حالة التاجر. عند إضافة بياناتها مستقبلاً، لون/أيقونة التصميم
  // المعتمد لها: {icon:'percent', color:'#EC4899'} (وردي).
  return sections;
}

function chunk(arr,size){
  var out=[];
  for(var i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));
  return out;
}

// مربّع قسم واحد: دائرة ملوّنة بخلفية فاتحة للأيقونة (+نقطة حمراء صغيرة
// إن كان القسم يحمل تنبيهات غير مقروءة)، اسم القسم، وصف قصير سطران،
// رصيد النقاط بخط كبير ذهبي لقسم الولاء فقط، ثم سهم دائري صغير أسفله.
function msecHtml(s,merchantId){
  return '<button class="msec" data-open-section="'+s.key+'" data-merchant="'+merchantId+'">'+
    '<div class="msec-ico" style="background:'+s.color+'18">'+(s.alert?'<span class="msec-dot"></span>':'')+ic(s.icon,22,s.color)+'</div>'+
    '<b>'+s.label+'</b>'+
    '<p>'+s.desc+'</p>'+
    (s.pts!=null?'<div class="msec-pts">'+s.pts.toLocaleString('en-US')+' نقطة</div>':'')+
    '<div class="msec-arrow">'+ic('chevron',14,'#8A93AD')+'</div>'+
  '</button>';
}

// Merchant detail page: شبكة مربّعات (حتى 3 في الصف) — واحد لكل قسم فعّله
// هذا التاجر فعليًا فقط. تُقسَّم الأقسام لصفوف من 3 كحد أقصى، وكل صف يضبط
// عدد أعمدته على طوله الفعلي (chunk+repeat(len,1fr)) فيملأ عرضه بالكامل
// دون أي فراغات مهما كان إجمالي عدد الأقسام. الضغط على مربّع ينقل إلى
// صفحة مستقلة لذلك القسم. حالة خاصة: تاجر فعّل الفواتير فقط -> تُعرض
// القائمة مباشرة دون شبكة (مربّع واحد لا فائدة من عرضه كقائمة تنقّل).
function merchantDetail(){
  var m=USER_MERCHANTS.filter(function(x){return x.merchantId===S.selMerchant})[0];
  if(!m){
    return '<div class="sec-head" style="margin-top:20px"><h2>المتجر</h2></div>'+
      '<div class="empty">هذا المتجر غير متاح</div>';
  }
  var cat=CAT[m.type]||CAT['أخرى'];
  var myInvoices=INVOICES.filter(function(i){return i.merchantId===m.merchantId});

  var header='<div class="box"><div class="loy">'+
    '<div class="loy-ico">'+ic(cat.i,30,cat.c)+'</div>'+
    '<div class="loy-mid"><small>'+m.type+'</small><b style="font-size:16px">'+m.name+'</b>'+
    (m.branch?'<p>'+m.branch+'</p>':'')+'</div>'+
  '</div></div>';

  var sections=merchantSectionsList(m,myInvoices);

  // حالة خاصة: لا شيء مفعّل عدا الفواتير -> عرضها مباشرة دون شبكة مربعات
  if(sections.length===1&&sections[0].key==='invoices'){
    var sel=INVOICES.filter(function(i){return i.id===S.sel&&i.merchantId===m.merchantId})[0];
    var list='<div class="sec"><div class="sec-head"><h2>فواتيري</h2></div><div class="list">'+
      myInvoices.map(function(i){var mc=CAT[i.c];return '<button class="row" data-inv="'+i.id+'">'+
        '<div class="row-ico" style="background:'+mc.c+'18">'+ic(mc.i,22,mc.c)+'</div>'+
        '<div class="row-txt"><b>'+i.d+'</b><small>'+i.c+'</small></div>'+
        '<div class="inv-amt">'+i.a.toFixed(2)+'</div></button>'}).join('')+
    '</div></div>';
    return '<div class="sec-head" style="margin-top:20px"><h2>'+m.name+'</h2></div>'+
      header+list+invoiceModal(sel);
  }

  var grid='<div style="margin-top:14px">'+chunk(sections,3).map(function(row){
    return '<div class="msec-grid" style="grid-template-columns:repeat('+row.length+',1fr)">'+
      row.map(function(s){return msecHtml(s,m.merchantId)}).join('')+'</div>';
  }).join('')+'</div>';

  return '<div class="sec-head" style="margin-top:20px"><h2>'+m.name+'</h2></div>'+
    header+grid;
}

// صفحات فرعية مستقلة لكل قسم (تُفتح من مربّع الشبكة أعلاه) — كل واحدة
// تعرض المحتوى الذي كان مدمجًا سابقًا داخل صفحة المتجر، بلا أي تغيير في
// تصميمه أو مكوّناته، وزر رجوع يعيد لصفحة المتجر نفسها (نفس S.selMerchant).
function merchantInvoicesPage(){
  var m=USER_MERCHANTS.filter(function(x){return x.merchantId===S.selMerchant})[0];
  if(!m){
    return '<div class="sec-head" style="margin-top:20px"><h2>فواتيري</h2></div>'+
      '<div class="empty">هذا المتجر غير متاح</div>';
  }
  var myInvoices=INVOICES.filter(function(i){return i.merchantId===m.merchantId});
  var sel=INVOICES.filter(function(i){return i.id===S.sel&&i.merchantId===m.merchantId})[0];
  var list=myInvoices.length
    ?'<div class="list">'+myInvoices.map(function(i){var mc=CAT[i.c];return '<button class="row" data-inv="'+i.id+'">'+
        '<div class="row-ico" style="background:'+mc.c+'18">'+ic(mc.i,22,mc.c)+'</div>'+
        '<div class="row-txt"><b>'+i.d+'</b><small>'+i.c+'</small></div>'+
        '<div class="inv-amt">'+i.a.toFixed(2)+'</div></button>'}).join('')+'</div>'
    :'<div class="empty">لا توجد فواتير لدى هذا المتجر</div>';
  return '<div class="sec-head" style="margin-top:20px"><h2>فواتيري</h2></div>'+
    list+invoiceModal(sel);
}

function formatApptDateTime(iso){
  var d=new Date(iso);
  var dd=String(d.getDate()).padStart(2,'0');
  var mm=String(d.getMonth()+1).padStart(2,'0');
  var h=d.getHours(),mins=String(d.getMinutes()).padStart(2,'0');
  var ampm=h>=12?'م':'ص';
  var h12=h%12||12;
  return dd+'/'+mm+' - '+h12+':'+mins+' '+ampm;
}

function apptRowHtml(a){
  return '<div class="rw"><div><b>'+a.clinicName+'</b><small>'+(a.doctorName?a.doctorName+' · ':'')+formatApptDateTime(a.scheduledAt)+'</small></div>'+
    '<div style="display:flex;gap:8px;flex-shrink:0">'+
      '<button data-edit-appt="'+a.id+'" style="padding:9px 14px;border-radius:12px;font-size:12px;font-weight:700;background:var(--line);color:var(--text)">تعديل</button>'+
      '<button data-cancel-appt="'+a.id+'" style="padding:9px 14px;border-radius:12px;font-size:12px;font-weight:700;background:#FEF2F2;color:#DC2626">إلغاء</button>'+
    '</div></div>';
}

// صفحة "مواعيدي"/"حجز طاولة"/"حجز مسبق" — للمراكز الصحية (m.type==='صحة')
// تعرض مواعيد العميل الحقيقية القادمة (من جدول appointments) مع خياري
// تعديل (توست فقط — لا واجهة إعادة جدولة في هذه النسخة) وإلغاء (فعلي:
// يحدّث appointments.status ويحذف السطر من #apptList فقط دون render()
// كامل)، وزر "حجز موعد جديد" يفتح قائمة العيادات التي تقبل الحجز فقط
// (booking_enabled على مستوى العيادة نفسها) — الحجز نفسه توست تجريبي فقط،
// كبقية أزرار الحجز في التطبيق. أي تاجر آخر (مطعم/مقهى/إلخ) يبقي على
// الزر العام البسيط، بعنوانه ووصفه المخصّصين لقطاعه (bookingCopyFor).
function merchantBookingPage(){
  var m=USER_MERCHANTS.filter(function(x){return x.merchantId===S.selMerchant})[0];
  var bc=bookingCopyFor(m?m.type:null);
  if(!m){
    return '<div class="sec-head" style="margin-top:20px"><h2>'+bc.label+'</h2></div>'+
      '<div class="empty">هذا المتجر غير متاح</div>';
  }

  if(m.type==='صحة'){
    var appts=MERCHANT_APPOINTMENTS[m.merchantId];
    var apptsHtml;
    if(appts===undefined)apptsHtml='<p style="font-size:13px;color:var(--muted)">جارٍ تحميل مواعيدك...</p>';
    else if(!appts.length)apptsHtml='<div class="empty">لا توجد مواعيد قادمة لديك حاليًا</div>';
    else apptsHtml='<div class="list" id="apptList">'+appts.map(apptRowHtml).join('')+'</div>';

    var clinics=MERCHANT_CLINICS[m.merchantId]||[];
    var bookable=clinics.filter(function(c){return c.bookingEnabled});
    var newBtn=bookable.length?'<button class="btn" data-toggle-appt-picker="1" style="margin-top:14px">'+ic('clock',16,'#fff')+' حجز موعد جديد</button>':'';
    var picker=(S.showApptPicker&&bookable.length)?'<div class="list" style="margin-top:10px">'+bookable.map(function(c){
      return '<button class="row" data-book-clinic="'+c.clinicId+'" data-clinic-name="'+c.clinicName+'"><div class="row-ico" style="background:#0F6E6E18">'+ic('hospital',22,'#0F6E6E')+'</div>'+
        '<div class="row-txt"><b>'+c.clinicName+'</b>'+(c.doctorName?'<small>'+c.doctorName+'</small>':'')+'</div>'+ic('chevron',18,'#8A93AD')+'</button>';
    }).join('')+'</div>':'';
    return '<div class="sec-head" style="margin-top:20px"><h2>'+bc.label+'</h2></div>'+
      apptsHtml+newBtn+picker;
  }

  return '<div class="sec-head" style="margin-top:20px"><h2>'+bc.label+'</h2></div>'+
    '<div class="box"><p style="font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.7">'+bc.desc+' لدى '+m.name+'.</p>'+
    '<button class="btn" data-book="'+m.merchantId+'">'+ic('clock',16,'#fff')+' احجز الآن</button></div>';
}

// بطاقة عيادة واحدة في قائمة "الانتظار الذكي" لمركز صحي. عيادة العميل
// النشطة (لديه رقم فيها فعليًا) تُميَّز ببطاقة .qcard الملوّنة نفسها
// المستخدمة لتذكرة الانتظار العادية، وتُعرض أولاً في القائمة؛ بقية
// العيادات ببطاقة .box عادية مع مؤشر ازدحام ملوّن (متاحة/متوسطة/مزدحمة)
// محسوب من عدد المنتظرين الفعلي.
function clinicRowHtml(c,isMine){
  if(isMine){
    return '<div class="qcard" style="margin-bottom:14px"><div class="qtop">'+
      '<small>'+ic('pin',12,'#fff')+' '+c.clinicName+(c.doctorName?' - '+c.doctorName:'')+'</small>'+
      '<div class="qnum">#'+QUEUE.ticket+'</div><div class="qstate">دورك أنت</div></div>'+
      '<div class="qbody">'+
      '<div class="qrow"><span>عدد الأشخاص قبلك</span><span>'+S.q.ahead+'</span></div>'+
      '<div class="qrow"><span>الرقم الحالي بالعيادة</span><span>#'+(c.nowServing!=null?c.nowServing:'—')+'</span></div>'+
      '<div class="qrow"><span>الوقت المتوقع</span><span>~'+c.estMinutes+' دقيقة</span></div>'+
      '</div></div>';

function toast(m){var e=document.getElementById('toast');document.getElementById('toast-text').textContent=m;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2400)}

function countUp(el,target,dur,dec){
  if(!el)return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.textContent=target.toLocaleString('en-US',dec?{minimumFractionDigits:2}:{});return;
  }
  var start=null;
  function step(ts){
    if(!start)start=ts;
    var p=Math.min((ts-start)/dur,1);
    var e=1-Math.pow(1-p,3);
    var val=target*e;
    el.textContent=dec
      ? val.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
      : Math.round(val).toLocaleString('en-US');
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function startTimer(){
  A.secs=30;
  clearInterval(A.timer);
  var updateResend=function(){
    var r=document.getElementById('resend');
    if(r)r.innerHTML=A.secs>0?'إعادة الإرسال بعد '+A.secs+' ثانية':'لم يصلك الرمز؟ <b>إعادة الإرسال</b>';
  };
  updateResend();
  A.timer=setInterval(function(){
    A.secs--;
    if(A.secs<=0){clearInterval(A.timer);A.secs=0}
    updateResend();
  },1000);
}

function bindAuth(){
  var ph=document.getElementById('ph');
  if(ph){
    ph.oninput=function(){
      this.value=this.value.replace(/\D/g,'').slice(0,9);
      A.phone=this.value;
      if(A.err){
        A.err='';
        var e=document.querySelector('.auth-body .err');
        if(e)e.outerHTML='<div class="hint">سيصلك الرمز عبر رسالة نصية على هذا الرقم.</div>';
      }
    };
    ph.onkeydown=function(e){if(e.key==='Enter')document.getElementById('send').click()};
    setTimeout(function(){ph.focus()},250);
  }

  var send=document.getElementById('send');
  if(send)send.onclick=function(){
    if(A.phone.length<9||A.phone[0]!=='5'){
      A.err='أدخل رقم جوال سعودي صحيح يبدأ بـ 5 (9 أرقام).';
      renderAuth();return;
    }
    A.sending=true;renderAuth();
    setTimeout(function(){
      A.sending=false;A.step='code';A.code='';A.err='';
      renderAuth();startTimer();
    },700);
  };

  var edit=document.getElementById('edit');
  if(edit)edit.onclick=function(){A.step='phone';A.code='';A.err='';clearInterval(A.timer);renderAuth()};

  var otps=document.querySelectorAll('[data-otp]');
  function readCode(){
    var s='';
    [].forEach.call(otps,function(b){s+=(b.value||'')});
    return s;
  }
  [].forEach.call(otps,function(box,idx){
    box.oninput=function(){
      var v=this.value.replace(/\D/g,'');
      // support pasting the whole code into one box
      if(v.length>1){
        for(var k=0;k<otps.length;k++){otps[k].value=v[k]||'';
          if(otps[k].value)otps[k].classList.add('filled');else otps[k].classList.remove('filled')}
        this.blur();
      }else{
        this.value=v;
        if(v)this.classList.add('filled');else this.classList.remove('filled');
        if(v&&idx<3)otps[idx+1].focus();
      }
      A.code=readCode();A.err='';
      var vb=document.getElementById('verify');
      if(vb)vb.disabled=A.code.length<4;
      if(A.code.length===4)setTimeout(doVerify,180);
    };
    box.onkeydown=function(e){
      if(e.key==='Backspace'&&!this.value&&idx>0){
        otps[idx-1].focus();
        otps[idx-1].value='';
        otps[idx-1].classList.remove('filled');
        A.code=readCode();
        var vb=document.getElementById('verify');
        if(vb)vb.disabled=A.code.length<4;
      }
    };
    box.onfocus=function(){this.select()};
  });
  if(otps.length)setTimeout(function(){
    var next=A.code.length<4?otps[A.code.length]:otps[3];
    (next||otps[0]).focus();
  },250);

  var v=document.getElementById('verify');
  if(v)v.onclick=doVerify;

  var rs=document.getElementById('resend');
  if(rs)rs.onclick=function(){
    if(A.secs>0)return;
    A.code='';A.err='';renderAuth();startTimer();toast('تم إرسال الرمز مرة أخرى');
  };
}

async function doVerify(){
  if(A.code!==DEMO_CODE){
    A.err='رمز التحقق غير صحيح. حاول مرة أخرى.';
    A.code='';
    renderAuth();
    return;
  }
  clearInterval(A.timer);
  Store.set(K.SESSION,true);
  Store.set(K.PHONE,A.phone);

  var v=document.getElementById('verify');
  if(v){v.disabled=true;v.textContent='جارٍ تحميل بياناتك...'}

  S.dataLoading=true;
  var loadPromise=loginAndLoad(A.phone);

  var el=document.getElementById('auth');
  el.style.transition='opacity .35s ease, transform .35s ease';
  el.style.opacity='0';
  el.style.transform='scale(1.03)';
  setTimeout(function(){
    el.style.display='none';
    document.getElementById('app').style.display='';
    document.querySelector('.nav').style.display='';
    render();
    loadPromise.then(function(ok){
      S.dataLoading=false;
      render();
      toast(ok?'أهلاً بك في NOJ 👋':'تعذّر الاتصال بالخادم، تُعرض بيانات محدودة');
    });
  },340);
}

function logoutFlow(){
  clearInterval(A.timer);
  Store.remove(K.SESSION);
  Store.remove(K.PHONE);
  A={step:'phone',phone:'',code:'',err:'',sending:false,secs:0,timer:null};
  PROFILE={id:null,name:'',phone:'',tier:'برونزي'};
  QUEUE={ticket:null,label:'',merchantId:null};
  INVOICES=[];CATS=[];MERCHANT_LOYALTY=[];USER_MERCHANTS=[];MERCHANT_QUEUE_STATS={};
  S.selMerchant=null;
  var el=document.getElementById('auth');
  el.style.display='';el.style.opacity='';el.style.transform='';
  document.getElementById('app').style.display='none';
  document.querySelector('.nav').style.display='none';
  renderAuth();
}
