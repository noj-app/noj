name: نشر Edge Functions

# نشر يدوي فقط — زر "Run workflow" في تبويب Actions على GitHub، يعمل من
# متصفح (حتى من تابلت) بلا أي حاسوب. عمداً بلا تشغيل تلقائي عند push: المستخدم
# يشغّله بنفسه بعد وضع الأسرار والتأكد منها. راجع supabase-edge-functions-
# deploy.md لخطوات الإعداد اليدوية الكاملة (مرة واحدة فقط): توكن Supabase +
# معرّف المشروع، كلاهما يُحفظان كأسرار مستودع GitHub ولا يُكتبان هنا أبداً.
#
# --no-verify-jwt: كلتا الدالتين تُستدعى بتوقيع/توثيق خاص بها في رأس
# Authorization نفسه (توكن الفرع لـ pos-intake، وSupabase لا يضع Authorization
# في طلب Send SMS Hook أصلاً) — لا بتوكن JWT صادر من Supabase. بوابة Supabase
# الافتراضية تتحقق من أن Authorization يحمل JWT صالحاً **قبل** وصول الطلب لكود
# الدالة، فترفض كل طلب حقيقي بـ401 دون أن يُشغَّل الكود أصلاً. مثبَّتة أيضاً في
# supabase/config.toml (verify_jwt = false لكل دالة) كإعداد دائم — العلم هنا
# تأكيد إضافي صريح في كل نشر، لا بديل عن ملف الإعداد.
#
# Supabase CLI مثبَّت على إصدار محدد مجرَّب (لا latest أبداً — راجع CLAUDE.md
# "إصدارات الأدوات في الـworkflows"): latest صار 3.0.0 في 2 نوفمبر 2026 فتوقف
# النشر بلا أي تغيير منا ("Confirmation required ... stdout is not a terminal").
# في 3.x:
#   --yes            كل تغيير على المشروع الحي يطلب تأكيداً، والمشغّل بلا طرفية
#                    فلا يستطيع السؤال ⇒ التأكيد الصريح في الأمر نفسه.
#   --remote=<ref>   تحديد المشروع (بديل --project-ref المهجور، يُزال في v4).
# أي ترقية للإصدار = PR مستقل يجرّب الأوامر نفسها على الإصدار الجديد أولاً.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # الإجراء نفسه على وسم محدد: v1 (= v1.7.3) إجراء JavaScript على Node 20 المهجور (تحذير
      # "Node.js 20 actions are deprecated"). v3.0.0 (يوليو 2026) إجراء composite لا يعمل على
      # Node 20، وما يستعمله داخلياً على Node 24 (actions/setup-node v6.4.0، oven-sh/setup-bun
      # v2.2.0)، ويقبل version إصداراً محدداً من npm كما هنا. لا @v3 العائم (قاعدة CLAUDE.md).
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: 3.0.0

      - name: نشر send-sms-hook
        run: supabase functions deploy send-sms-hook --remote="$SUPABASE_PROJECT_ID" --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: نشر pos-intake
        run: supabase functions deploy pos-intake --remote="$SUPABASE_PROJECT_ID" --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
