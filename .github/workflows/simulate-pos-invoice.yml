name: محاكاة فاتورة كاشير

# محاكاة يدوية بحتة (workflow_dispatch فقط، بلا أي تشغيل تلقائي) لفاتورة
# POS حقيقية، بلا أي حاسوب أو كاشير فعلي — تُستخدم لاختبار المسار الكامل
# (pos-intake ← kiosk.html الوضع المباشر ← ربط الرقم) من متصفح فقط. راجع
# supabase-pos-simulator.md لخطوات الإعداد الكاملة بالترتيب (إصدار توكن فرع
# الاختبار، وضعه سرّاً هنا باسم NOJ_TEST_POS_TOKEN، تشغيل هذا الـ workflow).
#
# يستدعي scripts/simulate-pos-invoice.js مباشرة — لا يُعاد بناء الحمولة هنا
# بمنطق bash/node منفصل (كان هذا بالضبط مصدر عطل حي سابق: external_ref
# يُحسَب كمتغيّر bash عادي غير مُصدَّر export، فلا يصل لعملية node الفرعية
# أصلاً، وJSON.stringify يُسقط الحقل بصمت بدل أن يفشل — pos-intake رفض
# الطلب برسالة "external_ref مطلوب" رغم أن amount وvat وصلا بسلامة، لأنهما
# فقط ضُبطا عبر env: في YAML هذا الملف، لا كمتغيّرات bash محسوبة لاحقاً).
# مصدر الحقيقة الوحيد الآن لبناء الحمولة: scripts/pos-invoice-payload.mjs،
# يستخدمه هذا الـ workflow والسكربت نفسه من حاسوب مطوّر، ويُختبَر مباشرة في
# supabase/functions/pos-intake/simulator-payload.test.ts عبر Deno.
#
# NOJ_TEST_POS_TOKEN توكن فرع اختبار حقيقي (نفس آلية Bearer <توكن الفرع> في
# CLAUDE.md) — سرّ GitHub فقط، لا يُطبع أبداً في أي خطوة من هذا الملف ولا من
# السكربت (يُطبع فقط حالة الاستجابة ومعرّف العملية).

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'إجمالي ما دفعه العميل شاملاً الضريبة (مثال: 115) — مطلوب لفاتورة جديدة، ويُترك فارغاً عند الإرجاع'
        required: false
        default: ''
      vat:
        description: 'الضريبة المتضمَّنة داخل المبلغ لا فوقه، وأقل من المبلغ (مثال: 15 لمبلغ 115؛ افتراضي 0)'
        required: false
        default: '0'
      device_id:
        description: 'معرّف جهاز الكشك (اختياري، UUID)'
        required: false
        default: ''
      refund_of:
        description: 'للإرجاع بدل فاتورة جديدة: external_ref الفاتورة الأصلية (يُطبع عند إرسالها، مثال sim-12-1700000000000)'
        required: false
        default: ''
      refund_amount:
        description: 'مبلغ الإرجاع شاملاً الضريبة (مطلوب مع refund_of؛ جزئي أو كامل، والمجموع لا يتجاوز مبلغ الفاتورة)'
        required: false
        default: ''

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إرسال فاتورة محاكاة إلى pos-intake
        env:
          NOJ_TEST_POS_TOKEN: ${{ secrets.NOJ_TEST_POS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          # يمرّران عبر env: لا بتضمين ${{ }} مباشرة داخل run: (الأخيرة تُستبدَل
          # بنص حرفي قبل أن يرى القشرة السكربت، ما يفتح باب حقن أوامر لو احتوى
          # أحد مدخلات workflow_dispatch على رموز خاصة بالقشرة).
          AMOUNT: ${{ github.event.inputs.amount }}
          VAT: ${{ github.event.inputs.vat }}
          DEVICE_ID: ${{ github.event.inputs.device_id }}
          REFUND_OF: ${{ github.event.inputs.refund_of }}
          REFUND_AMOUNT: ${{ github.event.inputs.refund_amount }}
        run: |
          node scripts/simulate-pos-invoice.js \
            --amount "$AMOUNT" \
            --vat "$VAT" \
            --device-id "$DEVICE_ID" \
            --refund-of "$REFUND_OF" \
            --refund-amount "$REFUND_AMOUNT"
